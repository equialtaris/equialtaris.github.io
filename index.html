<style>
/* Layout: sidebar de módulos à esquerda, área de trabalho à direita; no celular a barra vira faixa horizontal no topo. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface2:#f5f7fa; --ink:#141b29; --muted:#5a6578; --line:#dbe0e8;
  --side:#111a2b; --side-ink:#c9d1df; --side-on:#ffffff;
  --accent:#d6a03a; --primary:#2447c8; --primary-ink:#ffffff; --sand:#f3efe3; --grid:#d9d2bd; --jump:#b4541a; --curve:#2447c8;
  --yel:#fde047;--yelink:#3b2a00;--ok:#17825a; --ok-bg:#dff3ea; --warn:#a96a00; --warn-bg:#fbefd2; --bad:#b8352a; --bad-bg:#f8dfdb;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#151d2f; --surface2:#1b2539; --ink:#e8ecf4; --muted:#9aa6bb; --line:#27324a;
  --side:#0a0f1b; --side-ink:#a9b4c9; --primary:#6c8cff; --primary-ink:#0b1020; --sand:#232a38; --grid:#34405a; --jump:#e0884a; --curve:#7fa0ff;
  --yel:#a16207;--yelink:#fffbeb;--ok:#4cc995; --ok-bg:#173a2d; --warn:#e8b04a; --warn-bg:#3d2f10; --bad:#ef7d72; --bad-bg:#432019; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d2f; --surface2:#1b2539; --ink:#e8ecf4; --muted:#9aa6bb; --line:#27324a;
  --side:#0a0f1b; --side-ink:#a9b4c9; --primary:#6c8cff; --primary-ink:#0b1020; --sand:#232a38; --grid:#34405a; --jump:#e0884a; --curve:#7fa0ff;
  --yel:#a16207;--yelink:#fffbeb;--ok:#4cc995; --ok-bg:#173a2d; --warn:#e8b04a; --warn-bg:#3d2f10; --bad:#ef7d72; --bad-bg:#432019; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:var(--sw,232px) minmax(0,1fr);min-height:100vh}
#side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--side-on)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink)}
.brand.logo{justify-content:center;padding:2px 8px 0}
.brand.logo img{width:150px;height:auto;display:block;border-radius:10px}
.flip{width:150px;height:119px;perspective:900px}
.fl-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.25,1)}
.flip.go .fl-in{transform:rotateY(180deg)} .flip.nt .fl-in{transition:none}
.fl-f,.fl-b{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.brand.logo .fl-f{width:100%;height:100%;object-fit:contain}
.fl-b{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:transparent;border-radius:12px;padding:0;overflow:hidden}
.brand.logo .fl-b img{width:100%;height:100%;object-fit:contain}
@media (prefers-reduced-motion:reduce){.fl-in{transition:none}}
.lgprev{width:150px;height:120px;background:var(--side);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden} .lgprev img{max-width:100%;max-height:100%;object-fit:contain}
.lgl{background:#010b30;border-radius:12px;padding:16px 0;display:flex;justify-content:center}
.lgl img{width:200px;height:auto;display:block}
.stable{margin:0 8px;padding:9px 11px;border:1px solid #ffffff22;border-radius:8px;font-size:12px}
.stable b{display:block;color:var(--side-on);font-size:13px}
nav{display:flex;flex-direction:column;gap:2px}
#side nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin-right:-6px;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}
#side nav::-webkit-scrollbar{width:6px}#side nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px}#side nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45)}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:7px;cursor:pointer;text-align:left;font-weight:500}
nav button svg{width:17px;height:17px;flex:none}

nav button:hover{background:#ffffff12}
nav button[aria-current="page"]{background:var(--accent);color:#1a1405;font-weight:700}
.trial{margin-top:auto;padding:10px 12px;border-radius:8px;background:#ffffff10;font-size:12px}
.trial b{color:var(--side-on)}
/* menu encolhido: só os ícones, abre ao passar o mouse */
@media (min-width:861px){
  #app{--sw:76px}
  #side{width:76px;transition:width .17s ease,box-shadow .17s ease;z-index:60;overflow:visible;padding:18px 10px;gap:14px}
  #side:hover,#side:focus-within{width:238px;box-shadow:10px 0 34px rgba(5,9,18,.42)}
  #side nav{overflow-x:hidden}
  nav button{gap:0;padding:10px 9px;position:relative}
  #side:hover nav button,#side:focus-within nav button{gap:10px}
  nav button .rot{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .17s ease,opacity .13s ease}
  #side:hover nav button .rot,#side:focus-within nav button .rot{max-width:170px;opacity:1}
  nav button .chev{opacity:0;transition:opacity .13s ease}
  #side:hover nav button .chev,#side:focus-within nav button .chev{opacity:1}
  nav button .badge{position:absolute;top:3px;right:3px;min-width:7px;height:7px;padding:0;font-size:0;line-height:0;border-radius:99px;transition:none}
  #side:hover nav button .badge,#side:focus-within nav button .badge{position:static;min-width:18px;height:auto;padding:1px 6px;font-size:10.5px;line-height:1.5;margin-left:auto}
  #side nav button.nsub{padding-left:9px}
  #side:hover nav button.nsub,#side:focus-within nav button.nsub{padding-left:30px}
  .brand.logo{overflow:hidden}
  .flip{width:52px;height:42px;transition:width .17s ease,height .17s ease}
  #side:hover .flip,#side:focus-within .flip{width:150px;height:119px}
  .stable,.trial{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:0;border-width:0;overflow:hidden;transition:opacity .13s ease,max-height .17s ease}
  .trial{margin-top:auto}
  #side:hover .stable,#side:focus-within .stable{opacity:1;max-height:90px;padding:9px 11px;border-width:1px}
  #side:hover .trial,#side:focus-within .trial{opacity:1;max-height:90px;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){#side,#side *{transition:none!important}}
main{padding:24px clamp(16px,3vw,36px) 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:28px}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.brass{background:var(--accent);border-color:var(--accent);color:#1a1405}
.btn.danger{color:var(--bad)}
/* dashboard */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.lgs{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--muted)} .dvlg{display:inline-flex;align-items:center;gap:6px} .dvlg i,.dnl i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dn{display:flex;align-items:center;gap:24px;flex-wrap:wrap} .dnl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:170px} .dnl li{display:flex;align-items:center;gap:8px} .dnl li b{margin-left:auto;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column;gap:12px;margin-top:6px} .hbr{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:10px} .hbl{font-size:13px;line-height:1.2} .hbt{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden} .hbt i{display:block;height:100%;border-radius:0 4px 4px 0} .hbv{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;display:none}
[data-tip]{cursor:default}
a.btn{text-decoration:none;color:var(--ink,inherit);display:inline-flex;align-items:center}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.cell button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font-size:16px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.tw{overflow:auto;max-height:min(70vh,620px);border:1px solid var(--line);border-radius:12px;background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.tw.nolim{max-height:none;overflow-y:visible;overflow-x:auto}
.tw thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.tw::-webkit-scrollbar{width:10px;height:10px}.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}.tw::-webkit-scrollbar-thumb:hover{background:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:0;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button.pill{cursor:pointer}
.muted{color:var(--muted)} .sm{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fg .full{grid-column:1/-1}
/* modal */
.ov{position:fixed;inset:0;background:#0b1020aa;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.md{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:22px;box-shadow:0 20px 60px #0006}
.md.wide{width:min(760px,100%)}
.md h3{font-size:19px;margin-bottom:14px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.act .sp{margin-right:auto}
pre.zap{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;margin:0;max-height:48vh;overflow:auto}
/* programação */
.wk{min-width:1000px;border-collapse:separate;border-spacing:0}
.wk thead th{position:sticky;top:0;z-index:3;background:var(--surface2);border-bottom:1px solid var(--line)}
.wk th.hd{text-align:center;padding:9px 6px;line-height:1.3;font-size:12.5px;letter-spacing:.3px}
.wk th.hd i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-top:1px}
.wk th.hd u{display:block;text-decoration:none;font-weight:600;font-size:11px;color:var(--primary);margin-top:2px}
.wk th.today{background:var(--accent);color:#1a1405}
.wk th.today i,.wk th.today u{color:#4a3a06}
.wk th.fech{color:var(--muted)}
.wk td{vertical-align:top;min-width:132px;padding:5px;border-bottom:1px solid var(--line)}
.wk td.hz{position:sticky;left:0;z-index:2;min-width:86px;background:var(--surface2);white-space:nowrap;border-right:1px solid var(--line)}
.wk td.hz b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums}
.wk td.tdy{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.wk td.fech{background:repeating-linear-gradient(135deg,transparent,transparent 7px,color-mix(in srgb,var(--line) 45%,transparent) 7px,color-mix(in srgb,var(--line) 45%,transparent) 14px)}
.wk tbody tr:last-child td{border-bottom:0}
.tr{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;background:var(--surface);font-size:12.5px}
.tr.done{background:var(--ok-bg);border-color:transparent}
.tr input{width:auto;margin-top:2px;accent-color:var(--ok)}
.tr button{background:none;border:0;text-align:left;cursor:pointer;padding:0;line-height:1.3}
.tr b{display:block}
.tr em{font-style:normal;color:var(--jump);font-size:11.5px;font-weight:600}
.tr.au{border-left:3px solid var(--primary);background:color-mix(in srgb,var(--primary) 7%,var(--surface))}
.tr.au.done{background:var(--ok-bg);border-left-color:var(--ok)}
.tr em{display:block}
.wk th.hd u.off{color:var(--muted);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-left:8px;vertical-align:middle;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 6%,transparent)}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.onn{margin-left:5px;font-size:11.5px;font-weight:700;color:var(--ok);vertical-align:middle}
.barras{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.barras li{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center}
.barras .bl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barras .bb{background:var(--surface2);border-radius:5px;height:9px;overflow:hidden}
.barras .bb i{display:block;height:100%;background:var(--primary);border-radius:5px}
.barras .bn{text-align:right;font-size:13px;white-space:nowrap}
.barras .bn small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.feed{display:grid;gap:14px;max-width:620px}
.pbar{display:flex;gap:4px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.12s}
.pb svg{width:19px;height:19px;flex:none}
.pb:hover{background:var(--surface2);color:var(--text)}
.pb.on{color:var(--primary)}
.pb.on svg{fill:color-mix(in srgb,var(--primary) 22%,transparent)}
.pb span{min-width:6px}
.coms{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cm{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.cm .cmb{flex:1;min-width:0}

  nav,#side nav{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;min-width:0;padding-bottom:2px;margin-right:0;padding-right:0}
  nav button{white-space:nowrap;padding:7px 10px}
  .ed{grid-template-columns:1fr}
  .top h1{font-size:24px}
}
@media (max-width:700px){
  /* barra de navegação sempre à mão, compacta */
  #side{position:sticky;top:0;z-index:30;padding:7px 10px 6px;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.28)}
  .brand.logo img{height:34px;width:auto}
  .flip{width:44px;height:34px}
  nav button{padding:8px 11px;font-size:13px}
  main{padding:14px 16px calc(44px + env(safe-area-inset-bottom,0px))}
  .top{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:16px}
  .top h1{font-size:23px}
  /* botões do topo em fila que desliza, em vez de empilhar */
  .top>*{min-width:0}
  #topact{flex-wrap:nowrap;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;gap:8px;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #topact::-webkit-scrollbar{display:none}
  #topact>*{flex:none;white-space:nowrap}
  /* no iPhone, campo com menos de 16px faz a tela dar zoom sozinha */
  input,select,textarea{font-size:16px}
  .btn{padding:9px 14px}
  .tabs{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;flex:none}
  .stat{gap:10px}
  .tw{-webkit-overflow-scrolling:touch;max-height:none}
  .md{width:calc(100vw - 20px);max-width:none;max-height:86vh;overflow:auto}
  .feed,.card.adv{max-width:100%}
  .grid.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
  .perfcap{gap:12px}
  .cavhead img,.cavhead .semf{width:100%;height:180px}
  .pb{padding:8px 12px}
  /* agenda da programação */
  .agenda{display:grid;gap:10px}
  .ag{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
  .ag.hoje{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .ag.fech{background:var(--surface2)}
  .agh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .agh b{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
  .agh span{color:var(--muted);font-size:12.5px}
  .agh u{margin-left:auto;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--primary)}
  .agh u.off{color:var(--muted);font-weight:400}
  .ag .tr{font-size:13.5px}
  .ag .addw{margin-top:2px}
  .addt{border-color:var(--line);color:var(--muted)}
}
.chk{display:flex;gap:9px;align-items:flex-start;margin:8px 0;font-size:14px;line-height:1.45;cursor:pointer}
.chk input{width:17px;height:17px;flex:none;margin-top:1px;accent-color:var(--primary)}
.doc h2{font-family:var(--f-display);font-size:23px;margin:0 0 2px}
.doc .dsub{color:var(--muted);font-size:12.5px;margin:0 0 16px;text-transform:uppercase;letter-spacing:.06em}
.doc h3{font-size:15px;margin:20px 0 6px}
.doc p{margin:0 0 10px;line-height:1.65;max-width:72ch}
.acew{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
.acec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:760px;box-shadow:0 18px 50px rgba(10,16,30,.14)}
.acebox{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px;background:var(--bg)}
@media (max-width:640px){.acec{padding:16px}.acebox{max-height:50vh;padding:12px}}
.relcab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.relcab b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.relcab span{color:var(--muted);font-size:13px}
@media print{
  @page{margin:14mm}
  #side,#login,#modal,#aviso,.top,.tabs,#relact{display:none!important}
  #app{display:block}
  main{padding:0}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .kpi b{font-size:26px}
  table{font-size:12px}
}
@media (prefers-reduced-motion:no-preference){.md{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}

ned any slots for rescheduling yet. Come back later.", "Ganhos, custos e todos os lançamentos do mês, prontos para o contador.": "Income, costs and every entry of the month, ready for the accountant.", "Marque pelo menos um cavalo como particular na ficha dele, em Cavalos.": "Mark at least one horse as privately owned on its record, under Horses.", "Aluno ativo. Desmarque para tirar da Programação sem apagar o histórico.": "Active student. Untick to take them off the Schedule without deleting the history.", "Este navegador não abre .xlsx. Salve a planilha como CSV e envie de novo.": "This browser cannot open .xlsx. Save the spreadsheet as CSV and send it again.", "O prazo acabou. A remarcação só pode ser pedida até 1 hora antes da aula.": "Too late. A reschedule can only be requested up to 1 hour before the lesson.", "Se estiver certo assim, clique em Salvar de novo para marcar mesmo assim.": "If this is right, click Save again to book it anyway.", "Cada dia pode ter o seu horário. Desmarque o dia em que a hípica não abre.": "Each day can have its own hours. Untick the days the stable is closed.", "Doenças e tratamentos, exames, vacinas, peso, ferrageamento e observações.": "Conditions and treatments, tests, vaccines, weight, shoeing and notes.", "Inclui o resumo, a situação de cada aluno e a lista de quem deixou de pagar.": "Includes the summary, each student's status and the list of who stopped paying.", "Pronta para colar no WhatsApp da equipe, dos tratadores e dos proprietários.": "Ready to paste into the WhatsApp group for the team, the grooms and the owners.", "Informe o e-mail da sua conta. Você recebe um link para criar uma senha nova.": "Enter your account e-mail. You'll get a link to create a new password.", "Há mensalidade vencida. Informe o pagamento para evitar o bloqueio do sistema.": "There's an overdue fee. Report the payment to avoid the system being suspended.", "Li e aceito os Termos de Uso, a Política de Privacidade e as Regras da Comunidade.": "I have read and accept the Terms of Use, the Privacy Policy and the Community Rules.", "O arquivo é só leitura, para a hípica ter o seu próprio histórico fora do sistema.": "The file is read-only, so the stable keeps its own history outside the system.", "Precisa de um relatório que não está aqui? Peça que a gente acrescenta nesta tela.": "Need a report that isn't here? Ask and we'll add it to this screen.", "Nenhum mês fechado para arquivar. O mês corrente só entra aqui depois que terminar.": "No closed month to archive. The current month only appears here once it ends.", "O acesso do instrutor ao sistema é liberado pelo EquiAltaris a partir deste e-mail.": "EquiAltaris grants the instructor access to the system from this e-mail.", "Reúne treinos, provas, saúde, peso, ferrageamento, alimentação e custos do período.": "Brings together sessions, competitions, health, weight, shoeing, feeding and costs for the period.", "Ela vira o fundo do cartão da competição. Horizontal, pelo menos 1200 px de largura.": "It becomes the background of the competition card. Landscape, at least 1200 px wide.", "Leia e aceite os documentos abaixo. Guardamos a data e a versão do que você aceitou.": "Read and accept the documents below. We record the date and the version you accepted.", "O EquiAltaris mostra a competição, mas quem confirma a vaga é a hípica organizadora.": "EquiAltaris shows the competition, but the organising stable is the one that confirms your place.", "Aparecem nos Termos de Uso e na Política de Privacidade. Preencha quando o CNPJ sair.": "They appear in the Terms of Use and the Privacy Policy. Fill them in once the company is registered.", "A publicação aparece no seu perfil e no feed, com o crédito de quem publicou primeiro.": "The post appears on your profile and in the feed, crediting whoever posted it first.", "Hípicas, cobranças e cadastros voltam ao estado inicial. Os logins continuam os mesmos.": "Stables, charges and records go back to their starting state. The logins stay the same.", "O texto da autorização está em Termos e privacidade, na aba Autorização do Responsável.": "The consent wording is under Terms and privacy, on the Guardian Consent tab.", "O acesso desta hípica está suspenso. Fale com a administração da hípica para regularizar.": "This stable's access is suspended. Talk to the stable's management to sort it out.", "Clique num horário para liberar vaga de remarcação ou marcar aula direto na grade de cavalos.": "Click a time to open a reschedule slot or book a lesson straight on the horse grid.", "Os alunos pedem a inscrição pelo portal. Ao confirmar, a prova entra no calendário do cavalo.": "Students request entry through the portal. Once confirmed, the competition goes on the horse's calendar.", "O cartão passa a aparecer para as outras hípicas e para os alunos delas dentro do EquiAltaris.": "The card starts showing to the other stables and their students inside EquiAltaris.", "O que você publicar aqui aparece para todo o EquiAltaris. Nada de dados pessoais de terceiros.": "What you post here is visible across EquiAltaris. No personal details of other people.", "O responsável autoriza o aluno a publicar na Comunidade e o uso da imagem dele nas publicações.": "The guardian allows the student to post in the Community and their image to be used in posts.", "A imagem saiu do sistema para liberar espaço e está no arquivo XML do mês, guardado pela hípica.": "The image left the system to free space and is in the month's XML archive, kept by the stable.", "Ao enviar, o acesso ao sistema é liberado e o administrador da plataforma confere o comprovante.": "On sending, access is restored and the platform administrator checks the receipt.", "Depois de pagar, entre no sistema, abra \"Meu plano\" e informe o pagamento anexando o comprovante.": "After paying, sign in, open \"My plan\" and report the payment with the receipt attached.", "Baixe o modelo, preencha as abas Alunos e Cavalos e envie o arquivo de volta. Aceita .xlsx e .csv.": "Download the template, fill in the Alunos and Cavalos tabs and send the file back. Accepts .xlsx and .csv.", "Usados como sugestão ao cadastrar uma hípica. O valor de cada cliente pode ser ajustado na ficha dele.": "Used as a suggestion when adding a stable. Each client's price can be adjusted on their record.", "Você pode pedir remarcação até 1 hora antes da aula, escolhendo um dos horários liberados pela hípica.": "You can ask to reschedule up to 1 hour before the lesson, choosing one of the slots the stable opened.", "Não encontrei as colunas do modelo nesta planilha. Baixe o modelo e preencha nas abas Alunos e Cavalos.": "I could not find the template columns in this spreadsheet. Download the template and fill in the Alunos and Cavalos tabs.", "Sua aula já aparece no novo horário, marcada como remarcada. O instrutor ou a hípica confirma o pedido.": "Your lesson already shows at the new time, marked as rescheduled. The instructor or the stable confirms it.", "Use pelo menos 8 caracteres. Guarde em lugar seguro: depois de trocar, ninguém consegue consultar a senha.": "Use at least 8 characters. Keep it somewhere safe: once changed, nobody can look the password up.", "Anote e entregue esta senha para a pessoa. Ela não fica guardada no sistema e não dá para consultar depois.": "Write this password down and hand it over. It isn't stored in the system and can't be looked up later.", "Clique na pista para colocar. Arraste um obstáculo já colocado para mover, e gire pela bolinha azul na ponta dele.": "Click the arena to place one. Drag a fence already placed to move it, and turn it by the blue dot at its end.", "Em cada parceiro você escolhe quais fotos usar e onde cada uma aparece: login, área do aluno e/ou área dos cavalos.": "For each partner you choose which photos to use and where each one appears: sign-in, student area and/or horse area.", "Para alunos menores de idade, use o e-mail do responsável. O acesso do aluno ao portal é liberado pelo EquiAltaris.": "For students under 18, use the guardian's e-mail. EquiAltaris grants the student access to the portal.", "Faça o PIX no app do seu banco e envie o print do comprovante na linha do pagamento. A hípica confere e confirma por aqui.": "Make the PIX transfer in your bank app and upload the receipt on the payment row. The stable checks and confirms it here.", ", o link para criar a senha nova já está a caminho. Ele vale por pouco tempo — se não chegar em alguns minutos, olhe o spam.": ", the link to create a new password is on its way. It is valid for a short time — if it doesn’t arrive in a few minutes, check your spam.", "Ele passa a aparecer na área Proprietários, com a conta do mês: a mensalidade abaixo mais os adicionais lançados no Financeiro.": "It starts showing in the Owners area with the month's account: the monthly fee below plus the extras entered under Finance.", "Preenche a tela toda sem esticar; telas com outra proporção cortam um pouco as bordas, então deixe o assunto principal no centro.": "It fills the whole screen without stretching; screens with other proportions crop the edges a little, so keep the subject in the middle.", "Os pagamentos continuam na lista, marcados como arquivados. Se precisar de um comprovante depois, ele está no XML que você guardou.": "The payments stay on the list, marked as archived. If you need a receipt later, it is in the XML you saved.", "Pague pela chave PIX abaixo e informe o pagamento com o comprovante. O sistema volta a funcionar assim que o pagamento for informado.": "Pay using the PIX key below and report the payment with the receipt. The system comes back as soon as the payment is reported.", "As fotos viram um carrossel no fundo da tela de login e, de forma discreta, nas áreas de cavalos e do aluno. Só parceiros ativos aparecem.": "The photos become a carousel behind the sign-in screen and, discreetly, in the horse and student areas. Only active partners appear.", "Conta uma visita por tela a cada cinco minutos, por pessoa. Guarda quem abriu e quando, para somar — não guarda o caminho que cada um fez.": "It counts one visit per screen every five minutes, per person. It records who opened what and when, to add up — not the path each person took.", "Cada aluno monta o seu cavalo. A aula entra uma vez na Programação, mas conta como uma aula para cada aluno no financeiro e no portal dele.": "Each student rides their own horse. The class appears once on the Schedule, but counts as one lesson per student in billing and in their portal.", "O administrador da hípica entra com esse e-mail. A senha é criada pelo EquiAltaris e enviada a ele; ninguém guarda senha dentro do sistema.": "The stable administrator signs in with this e-mail. EquiAltaris creates the password and sends it to them; no password is kept inside the system.", "O aluno passa a aparecer na Programação toda semana nesse horário, sem precisar lançar aula por aula. Deixe vazio se ele não tem horário fixo.": "The student starts showing on the Schedule every week at that time, with no need to enter lesson by lesson. Leave it empty if they have no fixed time.", "Clique em um horário livre para liberar vaga de remarcação ou agendar aula. Verde: aula marcada. Amarelo: aula remarcada. Tracejado: vaga liberada.": "Click a free time to open a reschedule slot or book a lesson. Green: lesson booked. Yellow: lesson rescheduled. Dashed: slot open.", "Os alunos com horário fixo já aparecem na Programação toda semana. O acesso ao portal de cada aluno é liberado pelo botão Acesso na lista de alunos.": "Students with a fixed weekly slot already show up on the Schedule every week. Portal access for each student is granted with the Access button on the student list.", "A grade da Programação mostra as faixas de cada dia. O que estiver marcado fora do horário continua aparecendo, em linhas separadas no topo e no fim.": "The Schedule grid shows each day's hours. Anything booked outside those hours still appears, in separate rows at function tradTexto(t){
  const k=String(t==null?'':t).trim();
  if(!k)return null;
  if(Object.prototype.hasOwnProperty.call(EN,k))return String(t).replace(k,EN[k]);
  for(let i=0;i<REGRAS.length;i++){
    const m=k.match(REGRAS[i][0]);
    if(m){try{return String(t).replace(k,REGRAS[i][1](m))}catch(e){}}
  }
  if(k.indexOf(' · ')>0){
    const ps=k.split(' · ');let mudou=false;
    const fora=ps.map(function(p){
      const q=p.trim();
      if(Object.prototype.hasOwnProperty.call(EN,q)){mudou=true;return p.replace(q,EN[q])}
      for(let i=0;i<REGRAS.length;i++){const m=q.match(REGRAS[i][0]);
        if(m){try{mudou=true;return p.replace(q,REGRAS[i][1](m))}catch(e){}}}
      return p;
    });
    if(mudou)return String(t).replace(k,fora.join(' · '));
  }
  return null;
}
const SEM_TRAD={SCRIPT:1,STYLE:1,CODE:1,PRE:1,TEXTAREA:1};
function traduzirDOM(root){
  if(LANG!=='en'||!root)return;
  try{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false);
    const l=[];let n;
    while(n=w.nextNode())l.push(n);
    for(let i=0;i<l.length;i++){
      const no=l[i],pai=no.parentNode;
      if(!pai||SEM_TRAD[pai.nodeName])continue;
      const t=tradTexto(no.nodeValue);
      if(t!=null)no.nodeValue=t;
    }
    const at=['placeholder','title','aria-label'];
    const els=root.querySelectorAll('[placeholder],[title],[aria-label]');
    for(let i=0;i<els.length;i++)for(let j=0;j<at.length;j++){
      const v=els[i].getAttribute(at[j]);
      if(!v)continue;
      const t=tradTexto(v);
      if(t!=null)els[i].setAttribute(at[j],t);
    }
  }catch(e){}
}

      if(estavel(L[pos])===estavel(l.d)){ITC.snap[k]=JSON.stringify(L[pos]);return}
      substitui(L[pos],l.d);ITC.snap[k]=JSON.stringify(L[pos]);
    }else{L.push(l.d);ITC.snap[k]=JSON.stringify(l.d)}
    mudou=true;
  });
  ITC.desde=r.agora;
  return mudou;
}
/* envia so os registros que mudaram aqui */
async function itensEmpurrar(){
  const S=TT();
  if(!S)return true;
  const linhas=[],vistos={};
  COLS_IT.forEach(c=>{
    if(!podeGravar(c))return;
    (S[c]||[]).forEach(o=>{
      if(!o||!o.id)return;
      const k=c+'|'+o.id;vistos[k]=1;
      const js=JSON.stringify(o);
      if(ITC.snap[k]!==js)linhas.push({c:c,i:String(o.id),d:o,_k:k,_js:js});
    });
  });
  Object.keys(ITC.snap).forEach(k=>{
    const p=k.indexOf('|'),c=k.slice(0,p),i=k.slice(p+1);
    if(c==='cfg'||vistos[k]||!podeGravar(c))return;
    linhas.push({c:c,i:i,x:true,_k:k});
  });
  if(podeGravar('cfg')){
    const cf=cfgDe(S),js=JSON.stringify(cf);
    if(ITC.snap['cfg|cfg']!==js)linhas.push({c:'cfg',i:'cfg',d:cf,_k:'cfg|cfg',_js:js});
  }
  ITC.fila.splice(0).forEach(f=>linhas.push(f));
  if(!linhas.length)return true;
  let erro=false,recusa=0;
  for(let i=0;i<linhas.length;i+=200){
    const lote=linhas.slice(i,i+200);
    try{
      const r=await rpcJ('itens_gravar',{linhas:lote.map(l=>{const o={c:l.c,i:l.i};if(l.x)o.x=true;else o.d=l.d;if(l.dono)o.dono=l.dono;return o})});
      recusa+=(r&&r.recusa)||0;
      lote.forEach(l=>{if(!l._k)return;if(l.x)delete ITC.snap[l._k];else ITC.snap[l._k]=l._js});
    }catch(e){erro=true;lote.forEach(l=>{if(!l._k)ITC.fila.push(l)})}
  }
  /* o servidor recusou algo: na proxima volta recarrega tudo para ficar igual ao servidor */
  if(recusa&&Date.now()-ITC.recEm>120000){ITC.recarregar=true;ITC.recEm=Date.now()}
  return !erro;
}

async function carregarPeriodo(de){

async function syncPull(){
  if(SYNC.busy)return false;
  if(SYNC.pend)return false;   /* tem coisa daqui esperando subir: nao sobrescreve */
  if(formAberto()){clearTimeout(SYNC.rt);SYNC.rt=setTimeout(()=>{if(UI.user)syncPull()},15000);return false}
  if(!await authOk())return false;
  SYNC.busy=true;
  const repinta=()=>{const mexendo=document.querySelector('#modal .md')||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');if(!mexendo&&UI.user)render()};
  try{
    if(!SYNC.ready||ITC.recarregar||(!S&&!ehDono())){
      const r=ehAluno()?await fetchAluno():await fetchAll();
      if(!r)return false;
      let it=null;
      if(!ehDono()){it=await itensCarregar();if(!it)return false}
      ITC.recarregar=false;SYNC.ready=true;SYNC.platEm=Date.now();
      if(r.vazio&&ehDono()){G=seedG();normAll();await pushDirty();return true}
      G=r.g;
      if(it){
        if(it.hip&&it.hip.id){G.hips=G.hips.filter(h=>h.id!==it.hip.id);G.hips.push(it.hip)}
        G.tenants[minhaHip()]=it.T;
      }
      normAll();
      S=UI.user&&UI.user.hid?(G.tenants[UI.user.hid]||null):null;
      snapItens(ehDono()?null:TT());
      if(ehDono()){try{localStorage.setItem(GKEY,JSON.stringify(G))}catch(e){}carregarContagens()}
      else{try{localStorage.removeItem(GKEY)}catch(e){}}
      repinta();
      return true;
    }
    let mudou=false;
    if(!ehDono())mudou=await itensPuxar();
    const plat=(UI.view==='suporte'||UI.view==='o_chat')?15000:(ehDono()?60000:300000);
    if(Date.now()-(SYNC.platEm||0)>plat){
      const r=ehAluno()?await fetchAluno():await fetchAll();
      if(r){
        ['owner','planos','cob','files','parc','chat'].forEach(k=>{if(r.g[k]!==undefined)G[k]=r.g[k]});
        if(!ehAluno())G.hips=r.g.hips;
        normAll();SYNC.platEm=Date.now();mudou=true;
        if(ehDono())carregarContagens();
      }
    }
    if(mudou)repinta();
    return true;
  }catch(e){return false}finally{SYNC.busy=false}
}
async function pushDirty(){
  if(!SYNC.ready)return false;if(!await authOk())return false;
  let erro=false;
  if(!ehDono()){try{if(!await itensEmpurrar())erro=true}catch(e){erro=true}}
  if(ehAluno())return !erro;
  const agora=Date.now();
  for(const [t,chave] of TBL){
    if(!podeEscrever(t))continue;
    const locais=linhasLocais(t),vistos={};
    const mandar=[];
    locais.forEach(r=>{
      const k=r[chave];vistos[k]=1;
      const js=JSON.stringify(r.data);
      if(SNAP[t][k]!==js)mandar.push({r:r,js:js,k:k});
    });
    for(let i=0;i<mandar.length;i+=20){
      const lote=mandar.slice(i,i+20);
      try{
        const resp=await fetch(SB_URL+'/rest/v1/'+t+'?on_conflict='+chave,{method:'POST',
          headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},sbH()),
          body:JSON.stringify(lote.map(x=>Object.assign({rev:agora},x.r)))});
        if(resp.ok)lote.forEach(x=>{SNAP[t][x.k]=x.js});else erro=true;
      }catch(e){erro=true}
    }
    /* apagar o que sumiu daqui */
    const sumiram=Object.keys(SNAP[t]).filter(k=>!vistos[k]);
    for(const k of sumiram){
      try{
        const resp=await fetch(SB_URL+'/rest/v1/'+t+'?'+chave+'=eq.'+encodeURIComponent(k),{method:'DELETE',headers:sbH()});
        if(resp.ok)delete SNAP[t][k];else erro=true;
      }catch(e){erro=true}
    }
  }
  return !erro;
}

/* ---------- croqui: desenho ---------- */
function bars(it){return it.t==='vert'?[0]:it.t==='oxer'?[-.6,.6]:it.t==='triplo'?[-.9,0,.9]:[0]}
function shape(it){
  if(it.t==='cav')return '<rect class="s-cav" x="-1.3" y="-.12" width="2.6" height=".24" rx=".05"/>';
  const b=bars(it);let s='';
  b.forEach(y=>{s+='<rect class="s-ob" x="-1.75" y="'+(y-.12)+'" width="3.5" height=".24"/>'});
  const y0=b[0],y1=b[b.length-1];
  [y0,y1].forEach(y=>[-1.9,1.9].forEach(x=>{s+='<rect class="s-post" x="'+(x-.17)+'" y="'+(y-.17)+'" width=".34" height=".34"/>'}));
  return s;
}
function qlen(l){let L=0,p=l.a;for(let i=1;i<=40;i++){const t=i/40,u=1-t;const q={x:u*u*l.a.x+2*u*t*l.c.x+t*t*l.b.x,y:u*u*l.a.y+2*u*t*l.c.y+t*t*l.b.y};L+=Math.hypot(q.x-p.x,q.y-p.y);p=q}return L}
function llen(l){return l.k==='curve'?qlen(l):Math.hypot(l.b.x-l.a.x,l.b.y-l.a.y)}
function fixNums(c){const its=c.items.filter(i=>i.t!=='cav');let mx=0;its.forEach(i=>{if(i.n>mx)mx=i.n});its.forEach(i=>{if(!i.n)i.n=++mx});
  const o=its.slice().sort((a,b)=>a.n-b.n);o.forEach((i,k)=>{i.n=k+1})}
function numbered(c){fixNums(c);return c.items.filter(i=>i.t!=='cav').sort((a,b)=>a.n-b.n)}
function smoothD(P){if(P.length<2)return '';let d='M'+P[0].x+' '+P[0].y;if(P.length===2)return d+' L'+P[1].x+' '+P[1].y;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    d+=' C'+(p1.x+(p2.x-p0.x)/6)+' '+(p1.y+(p2.y-p0.y)/6)+' '+(p2.x-(p3.x-p1.x)/6)+' '+(p2.y-(p3.y-p1.y)/6)+' '+p2.x+' '+p2.y}return d}
function plen(P){let L=0;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
  const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};let q=p1;
  for(let k=1;k<=16;k++){const t=k/16,u=1-t;const r={x:u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x,y:u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y};L+=Math.hypot(r.x-q.x,r.y-q.y);q=r}}return L}
const PCOL='#c2410c';
function qAt(a,cp,b,t){const u=1-t;return {x:u*u*a.x+2*u*t*cp.x+t*t*b.x,y:u*u*a.y+2*u*t*cp.y+t*t*b.y}}
function cAt(a,c1,c2,b,t){const u=1-t;return {x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}}
function clen(a,c1,c2,b){let L=0,p=a;for(let i=1;i<=40;i++){const q=cAt(a,c1,c2,b,i/40);L+=Math.hypot(q.x-p.x,q.y-p.y);p=q}return L}
/* os dois pontos que o usuario arrasta ficam EM CIMA da linha, a 1/3 e 2/3 do caminho */
function bendPts(a,b,cp){
  if(cp&&cp.p&&cp.p.length===2)return [{x:cp.p[0].x,y:cp.p[0].y},{x:cp.p[1].x,y:cp.p[1].y}];
  if(cp&&typeof cp.x==='number')return [qAt(a,cp,b,1/3),qAt(a,cp,b,2/3)];
  return [{x:a.x+(b.x-a.x)/3,y:a.y+(b.y-a.y)/3},{x:a.x+2*(b.x-a.x)/3,y:a.y+2*(b.y-a.y)/3}];
}
/* acha a curva que passa exatamente pelos dois pontos arrastados */
function bendCtrl(a,b,q1,q2){
  const r1x=27*q1.x-8*a.x-b.x,r1y=27*q1.y-8*a.y-b.y;
  const r2x=27*q2.x-a.x-8*b.x,r2y=27*q2.y-a.y-8*b.y;
  return [{x:(2*r1x-r2x)/18,y:(2*r1y-r2y)/18},{x:(2*r2x-r1x)/18,y:(2*r2y-r1y)/18}];
}
function dists(c){
  const n=numbered(c),o=[],keep={};c.bends=c.bends||{};
  for(let i=1;i<n.length;i++){
    const A=n[i-1],B=n[i],k=A.id+'|'+B.id,a={x:A.x,y:A.y},b={x:B.x,y:B.y},cp=c.bends[k];keep[k]=1;
    if(cp){
      const q=bendPts(a,b,cp),cc=bendCtrl(a,b,q[0],q[1]);
      o.push({a:i,b:i+1,k:k,bent:true,h:q,len:clen(a,cc[0],cc[1],b),
        d:'M'+a.x+' '+a.y+' C'+cc[0].x+' '+cc[0].y+' '+cc[1].x+' '+cc[1].y+' '+b.x+' '+b.y,
        m:cAt(a,cc[0],cc[1],b,.5)});
    }
    else o.push({a:i,b:i+1,k:k,bent:false,h:bendPts(a,b,null),len:Math.hypot(b.x-a.x,b.y-a.y),d:'M'+a.x+' '+a.y+' L'+b.x+' '+b.y,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}});
  }
  Object.keys(c.bends).forEach(k=>{if(!keep[k])delete c.bends[k]});
  return o;
}

const DIA_LONGO=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

function alunoAtivo(st){return !!st&&st.ativo!==false}

function fixoTxt(st){
  const l=fixosDe(st);
  if(!l.length)return '';
  return l.map(f=>DIA_LONGO[+f.dow||0]+' '+(f.time||'')).join(' · ');
}
function aulasFixasDoDia(d){
  const i=(dt(d).getDay()+6)%7,out=[];
  (S.students||[]).forEach(st=>{
    if(!alunoAtivo(st))return;
    fixosDe(st).forEach(f=>{
      if(+f.dow!==i)return;
      if(f.desde&&d<f.desde)return;
      if(S.aulas.some(a=>a.student===st.id&&a.date===d&&a.time===f.time))return;
      out.push({id:'fx|'+st.id+'|'+f.dow+'|'+f.time+'|'+d,student:st.id,horse:f.horse||'',
        date:d,time:f.time,instrutor:f.instrutor||'',tipo:f.tipo||'Aula fixa',
        valor:+f.valor||0,status:'agendada',fixa:true});
    });
  });
  return out;
}
function aulasEntre(ini,fim,stId){
  const out=S.aulas.filter(a=>a.date>=ini&&a.date<=fim&&(!stId||a.student===stId));
  let d=ini,guarda=0;
  while(d<=fim&&guarda++<400){
    aulasFixasDoDia(d).forEach(a=>{if(!stId||a.student===stId)out.push(a)});
    d=addDays(d,1);
  }
  return out;
}
function materializarFixa(id){

  if(a)return a;

     instrutor:f.instrutor||'',tipo:f.tipo||'Aula fixa',valor:+f.valor||0,status:'agendada',deFixa:true};

function ocupadosEm(date,time,turmaId,aulaId){
  const iguais=a=>a.date===date&&(a.time||'')===time&&a.status!=='cancelada';
  const fora=a=>(turmaId?a.turma!==turmaId:true)&&(aulaId?a.id!==aulaId:true);
  return S.aulas.filter(a=>iguais(a)&&fora(a))
    .concat(aulasFixasDoDia(date).filter(a=>(a.time||'')===time));
}
function conflitos(v,turmaId,aulaId){
  const out=[],hora=v.time||'';
  const todas=ocupadosEm(v.date,hora,turmaId,aulaId);
  const vistos={};
  v.alunos.forEach(r=>{
    if(r.h){
      const c=todas.find(a=>a.horse===r.h);
      if(c)out.push(hn(r.h)+' já está em outra aula às '+hora+', com '+stName(c.student)+'.');
      if(vistos[r.h])out.push(hn(r.h)+' está escalado para dois alunos nesta mesma aula.');
      vistos[r.h]=1;
    }
    const ja=todas.find(a=>a.student===r.s);
    if(ja)out.push(stName(r.s)+' já tem outra aula marcada às '+hora+'.');
  });
  if(v.instrutor){
    const c=todas.find(a=>String(a.instrutor||'')===v.instrutor);
    if(c)out.push(v.instrutor+' já tem outra aula às '+hora+'.');
  }
  const lot=lotacao();
  if(lot){
    const total=todas.length+v.alunos.length;
    if(total>lot)out.push('A pista ficaria com '+total+' alunos às '+hora+' e o limite é '+lot+'.');
  }
  if(v.date&&hora){
    const c=expCfg(),i=(dt(v.date).getDay()+6)%7;
    if(!abreEm(c,i,hora))out.push('A hípica não abre '+DIA_LONGO[i]+' às '+hora+'.');
  }
  return out;
}

function agItens(d){
  const out=[],vistos={};
  S.treinos.forEach(t=>{if(t.date===d)out.push({k:'t',o:t,time:t.time||'00:00'})});
  S.aulas.forEach(a=>{
    if(a.date!==d||a.status==='cancelada'||!minhaAula(a))return;
    if(a.turma){
      if(vistos[a.turma])return;
      vistos[a.turma]=1;
      out.push({k:'a',o:a,g:S.aulas.filter(x=>x.turma===a.turma&&x.date===d&&x.status!=='cancelada'&&minhaAula(x)),time:a.time||'00:00'});
      return;
    }
    out.push({k:'a',o:a,time:a.time||'00:00'});
  });
  aulasFixasDoDia(d).forEach(a=>{if(minhaAula(a))out.push({k:'a',o:a,time:a.time||'00:00'})});
  return out.sort((x,y)=>x.time.localeCompare(y.time));
}

function semanaHTML(){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(UI.wk,i));
  let h='<div class="row" style="margin-bottom:12px"><button class="btn" data-act="wk" data-n="-7" aria-label="Semana anterior">\u2039</button><button class="btn" data-act="wk" data-n="0">Hoje</button><button class="btn" data-act="wk" data-n="7" aria-label="Pr\u00f3xima semana">\u203a</button><b style="margin-left:8px">Semana de '+fmtS(days[0])+' a '+fmtD(days[6])+'</b></div>';
  const c=expCfg();
  const rot=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  const hrs=[];for(let m=c.ini*60;m<=c.fim*60;m+=c.passo)hrs.push(rot(m));
  const hr=tm=>{const q=String(tm||'00:00').split(':');const m=(+q[0])*60+(+q[1]||0);
    if(m<c.ini*60)return 'cedo';
    if(m>c.fim*60+c.passo-1)return 'tarde';
    return rot(Math.floor((m-c.ini*60)/c.passo)*c.passo+c.ini*60)};
  const nt=days.map(d=>agItens(d));
  if(telaEstreita()){
    h+='<div class="agenda">'+days.map((d,i)=>{
      const its=nt[i],dd=c.dias[i],aberto=!!dd.on;
      const rot0=rot(dd.ini*60);
      return '<div class="ag'+(d===TODAY?' hoje':'')+(aberto?'':' fech')+'">'+
        '<div class="agh"><b>'+DOW[i]+'</b><span>'+fmtS(d)+(aberto?' \u00b7 '+faixaTxt(dd):'')+'</span>'+
          (aberto?(its.length?'<u>'+its.length+(its.length>1?' marcações':' marcação')+'</u>':'<u class="off">livre</u>'):'<u class="off">fechado</u>')+'</div>'+
        its.map(agCard).join('')+
        (aberto?'<div class="addw"><button class="addt" data-act="tnew" data-d="'+d+'" data-t="'+rot0+'">+ treino</button><button class="addt" data-act="anew" data-d="'+d+'" data-t="'+rot0+'">+ aula</button></div>':'')+
        '</div>';
    }).join('')+'</div>';
    return h;
  }
  const wkI=[].concat.apply([],nt);
  const rows=[];
  if(wkI.some(x=>hr(x.time)==='cedo'))rows.push(['cedo','Antes das '+pad(c.ini)+':00',rot(Math.max(0,c.ini*60-60))]);
  hrs.forEach(x=>rows.push([x,x,x]));
  if(wkI.some(x=>hr(x.time)==='tarde'))rows.push(['tarde','Ap\u00f3s '+pad(c.fim)+':00',rot(Math.min(23*60+30,c.fim*60+60))]);
  const lbl=i=>{if(!c.dias[i].on)return '<u class="off">fechado</u>';
    const a=nt[i].filter(x=>x.k==='a').length,t=nt[i].filter(x=>x.k==='t').length;
    if(!a&&!t)return '<u class="off">livre</u>';
    return '<u>'+[a?a+(a>1?' aulas':' aula'):'',t?t+(t>1?' treinos':' treino'):''].filter(Boolean).join(' \u00b7 ')+'</u>'};
  h+='<div class="tw nolim"><table class="wk"><thead><tr><th>Hor\u00e1rio</th>'+days.map((d,i)=>
      '<th class="hd'+(d===TODAY?' today':'')+(c.dias[i].on?'':' fech')+'">'+DOW[i].toUpperCase()+
      '<i>'+fmtS(d)+'</i>'+lbl(i)+(c.dias[i].on?'<s>'+faixaTxt(c.dias[i])+'</s>':'')+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr><td class="hz"><b>'+r[1]+'</b></td>';
    days.forEach((d,i)=>{
      const its=nt[i].filter(x=>hr(x.time)===r[0]);
      const aberto=(r[0]==='cedo'||r[0]==='tarde')?false:abreEm(c,i,r[0]);
      h+='<td class="cell'+(d===TODAY?' tdy':'')+(aberto?'':' fech')+'">'+its.map(agCard).join('')+
        (aberto||its.length?'<div class="addw"><button class="addt" data-act="tnew" data-t="'+r[2]+'" data-d="'+d+'">+ treino</button><button class="addt" data-act="anew" data-t="'+r[2]+'" data-d="'+d+'">+ aula</button></div>':'')+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

  modal({title:isNew?'Novo treino':'Editar treino',
    body:'<div class="fg">'+fld('Cavalo','t-h',t.horse,'select',S.horses.map(h=>[h.id,h.name]))+fld('Aluno','t-r',t.rider,'select',[['','—']].concat(S.students.map(r=>[r.id,r.name])))+
     fld('Data','t-d',t.date,'date')+fld('Horário','t-t',t.time,'time')+fld('Tipo de trabalho','t-k',t.tipo,'select',TIPOS)+
     fld('Croqui da pista','t-c',t.croqui,'select',[['','Sem croqui']].concat(S.croquis.map(c=>[c.id,c.name])))+fld('Observações','t-o',t.obs,'textarea',null,'full')+'</div>',
    del:isNew?null:()=>{S.treinos=S.treinos.filter(x=>x.id!==t.id)},

function amanhaText(){
  const d=addDays(TODAY,1);const tr=S.treinos.filter(t=>t.date===d).sort(byTime);
  const w=DOW[(dt(d).getDay()+6)%7];
  if(!tr.length)return 'Nenhum treino programado para '+w+' '+fmtS(d)+'.';
  return '*Programação de amanhã — '+w+', '+fmtS(d)+'*\n\n'+tr.map(t=>t.time+' · *'+hn(t.horse)+'* — '+t.tipo+(R(t.rider)?' ('+R(t.rider).name.split(' ')[0]+')':'')+(t.croqui&&CQ(t.croqui)?'\n      Croqui: '+CQ(t.croqui).name:'')+(t.obs?'\n      Obs.: '+t.obs:'')).join('\n')+'\n\nQualquer ajuste, me avisem.';
}
function relTreinosText(){
  const days=[0,1,2,3,4,5,6].map(i=>addDays(UI.wk,i));
  let s='Relatório de treinos — '+fmtD(days[0])+' a '+fmtD(days[6])+'\n';
  S.horses.forEach(h=>{const tr=S.treinos.filter(t=>t.horse===h.id&&t.date>=days[0]&&t.date<=days[6]);const dn=tr.filter(t=>t.done).length;
    s+='\n'+h.name+' — '+dn+' de '+tr.length+' treinos realizados\n';
    const c={};tr.forEach(t=>c[t.tipo]=(c[t.tipo]||0)+1);s+='  '+Object.keys(c).map(k=>k+': '+c[k]).join(' · ')+'\n'});
  return s;
}

views.cavalos=function(){
  if(!S.horses.length)return empty('Cadastre o primeiro cavalo.');
  return '<div class="grid g2">'+S.horses.map(h=>{
    const p=h.peso.slice().sort((a,b)=>a.d.localeCompare(b.d));
    let sp='';
    if(p.length>1){const mn=Math.min(...p.map(x=>x.kg))-3,mx=Math.max(...p.map(x=>x.kg))+3;const pts=p.map((x,i)=>(4+i*(192/(p.length-1)))+','+(50-(x.kg-mn)/(mx-mn)*44));
      sp='<svg class="spark" viewBox="0 0 200 54" preserveAspectRatio="none" role="img" aria-label="Evolução de peso"><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--primary)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'}
    const f=h.ferr.slice().sort((a,b)=>a.d.localeCompare(b.d)).pop();
    return '<div class="card horse"><h3>'+esc(h.name)+'<button class="btn sm" data-act="hedit" data-id="'+h.id+'">Editar</button></h3>'+
      '<div class="muted">Proprietário: '+esc(h.owner||'—')+(h.studentId?' · aluno com acesso ao portal':'')+'</div>'+
      '<div class="muted sm" style="margin-bottom:6px">'+[h.raca?esc(h.raca):'',idadeDe(h)!==null?idadeDe(h)+' anos':'',h.salto?'salta '+esc(h.salto):'',h.cm?esc(h.cm)+' cm':''].filter(Boolean).join(' · ')+'</div>'+
      '<div class="stat"><div><small>Peso</small><b>'+(p.length?p[p.length-1].kg+' kg':'—')+'</b></div><div><small>Último ferrageamento</small><b>'+(f?fmtS(f.d):'—')+'</b></div><div><small>Vencimento</small>'+pillFer(h)+'</div><div><small>Saúde</small>'+tratPill(h)+'</div></div>'+sp+
      '<div class="row"><button class="btn sm" data-act="hpeso" data-id="'+h.id+'">Registrar peso</button><button class="btn sm" data-act="hferr" data-id="'+h.id+'">Registrar ferrageamento</button><button class="btn sm brass" data-act="hhub" data-id="'+h.id+'">Saúde e alimentação</button></div></div>';
  }).join('')+'</div>';
};

let FEED=[],FEEDST='',FEEDFOTO=null,PERFIS={},MEUPERF=null,AVISOS=[],PERFVER=null,PERFPOSTS=[],PERFST='',PFOTO=null,PCAV=[],RESFOTO=null;
const meuUid=()=>(AUTH.user&&AUTH.user.id)||'';
function podePostar(){
  if(!UI.user)return false;
  if(UI.user.role==='aluno'){const st=R(UI.user.id);if(st&&!podeComunidade(st))return false;return true}
  return UI.user.role==='staff'||UI.user.role==='instrutor';
}
function quemSou(){
  if(!UI.user)return '';
  if(UI.user.role==='instrutor'){const i=IN(UI.user.id);return i?i.name:'Instrutor'}
  if(UI.user.role==='aluno'){const a=R(UI.user.id);return a?a.name:'Aluno'}
  return 'Administração';
}
function perfilDe(id){return (id&&PERFIS[id])||null}
function avatar(id,nome,t){
  t=t||40;const p=perfilDe(id),f=p&&p.foto;
  const ini=esc(String(nome||'?').trim().charAt(0).toUpperCase()||'?');
  return f?'<img class="av" style="width:'+t+'px;height:'+t+'px" src="'+esc(f)+'" alt="">'
          :'<span class="av vazio" style="width:'+t+'px;height:'+t+'px;font-size:'+Math.round(t/2.4)+'px">'+ini+'</span>';
}
async function loadPerfis(ids){
  const falta=[];ids.forEach(x=>{if(x&&!PERFIS[x]&&falta.indexOf(x)<0)falta.push(x)});
  if(!falta.length)return;
  try{
    const r=await fetch(SB_URL+'/rest/v1/perfis_pub?select=*&id=in.('+falta.join(',')+')',{headers:sbH()});
    if(r.ok)(await r.json()).forEach(p=>{PERFIS[p.id]=p});
  }catch(e){}
  falta.forEach(x=>{if(!PERFIS[x])PERFIS[x]={id:x,nome:'',foto:'',bio:'',cavalos:[]}});
}
async function loadMeuPerfil(){
  const u=meuUid();if(!u)return;
  try{const r=await fetch(SB_URL+'/rest/v1/perfis_pub?select=*&id=eq.'+u,{headers:sbH()});
    if(r.ok){const l=await r.json();MEUPERF=l[0]||null;if(MEUPERF)PERFIS[u]=MEUPERF}}catch(e){}
}
async function loadAvisos(){
  const u=meuUid();if(!u||UI.user&&UI.user.role==='owner'){AVISOS=[];return}
  try{const r=await fetch(SB_URL+'/rest/v1/avisos?select=*&para=eq.'+u+'&lido=is.false&order=criado_em.desc',{headers:sbH()});
    AVISOS=r.ok?await r.json():[]}catch(e){AVISOS=[]}
}
async function salvarPerfil(dados){
  const u=meuUid();if(!u)return false;
  const corpo=Object.assign({id:u,atualizado_em:new Date().toISOString()},dados);
  try{
    const r=await fetch(SB_URL+'/rest/v1/perfis_pub?on_conflict=id',{method:'POST',
      headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},sbH()),body:JSON.stringify([corpo])});
    if(!r.ok)return false;
    MEUPERF=Object.assign(MEUPERF||{},corpo);PERFIS[u]=MEUPERF;return true;
  }catch(e){return false}
}
async function loadFeed(){
  if(!await authOk()){FEEDST='erro';return}
  try{
    const r=await fetch(SB_URL+'/rest/v1/posts?select=*&order=criado_em.desc&limit=60',{headers:sbH()});
    if(!r.ok){FEEDST=(r.status===404||r.status===400)?'preparando':'erro';FEED=[];return}
    FEED=await r.json();FEEDST='ok';
    await loadPerfis(FEED.map(p=>p.autor_id));
    await loadInteracoes(FEED.map(p=>p.id));
    if(!MEUPERF)await loadMeuPerfil();
    await loadAvisos();
  }catch(e){FEEDST='erro';FEED=[]}
}

function idsIn(ids){return ids.filter(Boolean).map(x=>'"'+String(x).replace(/"/g,'')+'"').join(',')}
async function loadInteracoes(ids){
  const l=idsIn(ids);
  if(!l){LIKES={};COMN={};return}
  const u=meuUid();
  try{
    const r=await fetch(SB_URL+'/rest/v1/curtidas?select=post_id,uid&post_id=in.('+l+')',{headers:sbH()});
    if(r.ok){LIKES={};(await r.json()).forEach(c=>{const L=LIKES[c.post_id]||(LIKES[c.post_id]={n:0,eu:false});L.n++;if(c.uid===u)L.eu=true})}
  }catch(e){}
  try{
    const r=await fetch(SB_URL+'/rest/v1/comentarios?select=post_id&post_id=in.('+l+')',{headers:sbH()});
    if(r.ok){COMN={};(await r.json()).forEach(c=>{COMN[c.post_id]=(COMN[c.post_id]||0)+1})}
  }catch(e){}
}
async function curtir(id){
  const u=meuUid();if(!u)return;
  const L=LIKES[id]||(LIKES[id]={n:0,eu:false});
  const novo=!L.eu;
  L.eu=novo;L.n=Math.max(0,L.n+(novo?1:-1));render();
  try{
    if(novo)await fetch(SB_URL+'/rest/v1/curtidas?on_conflict=post_id,uid',{method:'POST',
      headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},sbH()),body:JSON.stringify({post_id:id,uid:u})});
    else await fetch(SB_URL+'/rest/v1/curtidas?post_id=eq.'+encodeURIComponent(id)+'&uid=eq.'+encodeURIComponent(u),{method:'DELETE',headers:sbH()});
  }catch(e){}
}
async function loadComs(id){
  try{
    const r=await fetch(SB_URL+'/rest/v1/comentarios?select=*&post_id=eq.'+encodeURIComponent(id)+'&order=criado_em.asc',{headers:sbH()});
    COMS[id]=r.ok?await r.json():[];
    await loadPerfis(COMS[id].map(c=>c.autor_id));
    COMN[id]=COMS[id].length;
  }catch(e){COMS[id]=COMS[id]||[]}
}
async function comentar(id){
  const t=(V('cm-'+id)||'').trim();
  if(!t)return {erro:'Escreva o comentário.'};
  const h=HIP();
  const corpo={id:uid(),post_id:id,autor_id:meuUid(),autor:quemSou(),hipica_nome:(h&&h.fantasia)||'',texto:t.slice(0,600)};
  try{
    const r=await fetch(SB_URL+'/rest/v1/comentarios',{method:'POST',headers:Object.assign({Prefer:'return=minimal'},sbH()),body:JSON.stringify(corpo)});
    if(!r.ok)return {erro:r.status===404?'Os comentários ainda não foram liberados no servidor.':'Não consegui comentar agora.'};
  }catch(e){return {erro:'Sem conexão com o servidor.'}}
  await loadComs(id);return {ok:true};
}
async function apagarCom(id,post){
  try{await fetch(SB_URL+'/rest/v1/comentarios?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbH()})}catch(e){}
  await loadComs(post);render();
}
function origDe(p){
  if(p.tipo==='repost'&&p.dados&&p.dados.orig)return p.dados.orig;
  return null;
}
async function repostar(p){
  const h=HIP();if(!h)return {erro:'Sua conta não está ligada a uma hípica.'};
  const o=origDe(p)||{id:p.id,autor:p.autor,autor_id:p.autor_id,hipica_nome:p.hipica_nome,texto:p.texto,foto:p.foto,tipo:p.tipo,dados:p.dados||{},criado_em:p.criado_em};
  if(o.autor_id&&o.autor_id===meuUid())return {erro:'Esta publicação já é sua.'};
  const corpo={id:uid(),hipica_id:h.id,hipica_nome:h.fantasia,autor:quemSou(),autor_id:meuUid()||null,
    texto:'',foto:'',tipo:'repost',repost_de:o.id,dados:{orig:o}};
  try{
    const r=await fetch(SB_URL+'/rest/v1/posts',{method:'POST',headers:Object.assign({Prefer:'return=minimal'},sbH()),body:JSON.stringify(corpo)});
    if(!r.ok)return {erro:'Não consegui repostar agora.'};
  }catch(e){return {erro:'Sem conexão com o servidor.'}}
  await loadFeed();return {ok:true};
}

async function loadPerfilView(id){
  PERFST='';PERFPOSTS=[];
  if(!await authOk()){PERFST='erro';return}
  try{
    await loadPerfis([id]);
    const r=await fetch(SB_URL+'/rest/v1/posts?select=*&autor_id=eq.'+encodeURIComponent(id)+'&order=criado_em.desc&limit=40',{headers:sbH()});
    PERFPOSTS=r.ok?await r.json():[];PERFST='ok';
    await loadInteracoes(PERFPOSTS.map(x=>x.id));
  }catch(e){PERFST='erro'}

async function publicarPost(extra){
  const t=(V('fd-t')||'').trim();
  if(!t&&!FEEDFOTO&&!extra)return null;
  const h=HIP();if(!h)return {erro:'Sua conta não está ligada a uma hípica.'};
  const corpo=Object.assign({id:uid(),hipica_id:h.id,hipica_nome:h.fantasia,autor:quemSou(),autor_id:meuUid()||null,
    texto:t,foto:FEEDFOTO||'',tipo:'post',dados:{}},extra||{});
  try{
    const r=await fetch(SB_URL+'/rest/v1/posts',{method:'POST',headers:Object.assign({Prefer:'return=minimal'},sbH()),body:JSON.stringify(corpo)});
    if(!r.ok)return {erro:r.status===404?'A Comunidade ainda não foi liberada no servidor.':'Não foi possível publicar agora.'};
    FEEDFOTO=null;RESFOTO=null;await loadFeed();return {ok:true};
  }catch(e){return {erro:'Sem conexão com o servidor.'}}
}
async function apagarPost(id){
  try{await fetch(SB_URL+'/rest/v1/posts?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbH()})}catch(e){}
  if(UI.view==='perfil'&&PERFVER){await loadPerfilView(PERFVER)}
  await loadFeed();render();
}
async function enviarAdvertencia(post,texto,apagar){
  const corpo={id:uid(),para:post.autor_id,de:G.owner.nome||'EquiAltaris',texto:texto,post_texto:(post.texto||'').slice(0,400)};
  try{
    const r=await fetch(SB_URL+'/rest/v1/avisos',{method:'POST',headers:Object.assign({Prefer:'return=minimal'},sbH()),body:JSON.stringify(corpo)});
    if(!r.ok)return false;
  }catch(e){return false}
  if(apagar)await apagarPost(post.id);else{await loadFeed();render()}
  return true;
}
function fmtQuando(iso){
  if(!iso)return '';
  const d=new Date(iso),m=Math.round((new Date()-d)/60000);
  if(m<1)return 'agora';
  if(m<60)return m+' min';
  if(m<1440)return Math.round(m/60)+' h';
  return fmtS(ymd(d));
}

function urlLimpa(u){
  const t=String(u||'').trim();
  if(!t)return '';

function igUser(u){
  const t=String(u||'').trim().replace(/^@/,'');

function hint(){const t=UI.tool;return t==='sel'?'Arraste para mover. Clique no obstáculo e gire pela bolinha azul na ponta. A linha cinza tem dois pontinhos: puxe os dois para abrir a curva. Dois cliques na linha deixam ela reta.':t==='path'?'Clique para marcar os pontos do traçado; dois cliques no último ponto (ou Enter) concluem. Depois arraste os pontos para ajustar.':t==='line'?'Clique em dois pontos para medir uma linha reta.':t==='curve'?'Clique no início, no fim e depois no ponto que define a curvatura.':'Clique na pista para colocar. Arraste um obstáculo já colocado para mover, e gire pela bolinha azul na ponta dele.'}
function distList(c){const d=dists(c);let s=d.map(x=>'<li><span>'+x.a+' → '+x.b+(x.bent?' <span class="muted">curva</span>':'')+'</span><b>'+num(x.len)+' m</b></li>').join('');
  c.lines.forEach((l,i)=>{s+='<li><span>'+(l.k==='curve'?'Curva':'Reta')+' '+(i+1)+'</span><b>'+num(llen(l))+' m</b></li>'});
  (c.paths||[]).forEach((pa,i)=>{s+='<li><span>Traçado '+(i+1)+'</span><b>'+num(plen(pa.pts))+' m</b></li>'});return s||'<li class="muted">Coloque dois obstáculos para ver a distância.</li>'}
function redraw(){const c=CQ(UI.cq);if(!c)return;const st=$('#stage'),sl=st.scrollLeft,sp=st.scrollTop;
  st.innerHTML=croquiSVG(c,{id:'stg',sel:UI.sel,tmp:UI.tmp,hover:UI.hover,showDist:UI.showDist,tool:UI.tool,zoom:UI.zoom});st.scrollLeft=sl;st.scrollTop=sp;$('#dl').innerHTML=distList(c);$('#hint').textContent=hint();bindStage()}
function snap(v){return Math.round(v*2)/2}
let CQD=null;let CQLAST=null;
function cqPtR(e){const svg=$('#stg');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function cqPt(e){const c=CQ(UI.cq),q=cqPtR(e);return {x:Math.max(0,Math.min(c.W,snap(q.x))),y:Math.max(0,Math.min(c.H,snap(q.y)))}}
function cqFind(c,id){return c.items.find(i=>i.id===id)||c.lines.find(l=>l.id===id)||(c.paths||[]).find(l=>l.id===id)}
window.addEventListener('pointermove',e=>{
  if(!UI.cq||UI.view!=='croquis'||!$('#stg'))return;const c=CQ(UI.cq);if(!c)return;
  if(CQD&&CQD.bend){const p=cqPt(e),ids=CQD.bend.split('|'),A=c.items.find(i=>i.id===ids[0]),B=c.items.find(i=>i.id===ids[1]);
    if(A&&B){
      const a={x:A.x,y:A.y},b={x:B.x,y:B.y};c.bends=c.bends||{};
      const q=bendPts(a,b,c.bends[CQD.bend]);
      q[CQD.bh||0]={x:p.x,y:p.y};
      const reto=bendPts(a,b,null);
      if(Math.hypot(q[0].x-reto[0].x,q[0].y-reto[0].y)<.45&&Math.hypot(q[1].x-reto[1].x,q[1].y-reto[1].y)<.45)delete c.bends[CQD.bend];
      else c.bends[CQD.bend]={p:q};
      redraw()}
    return}
  if(CQD){const p=cqPt(e),o=cqFind(c,CQD.id);if(!o){CQD=null;return}const dx=p.x-CQD.p0.x,dy=p.y-CQD.p0.y;
    if(CQD.rot&&o.t){const q=cqPtR(e),st=e.shiftKey?15:1;let a=Math.atan2(q.y-o.y,q.x-o.x)*180/Math.PI;o.r=((Math.round(a/st)*st)%360+360)%360}
    else if(o.t){o.x=CQD.orig.x+dx;o.y=CQD.orig.y+dy}
    else if(o.pts){if(CQD.pt!=null)o.pts[CQD.pt]={x:p.x,y:p.y};else o.pts=CQD.orig.pts.map(q=>({x:q.x+dx,y:q.y+dy}))}
    else{['a','b','c'].forEach(k=>{if(o[k]){o[k]={x:CQD.orig[k].x+dx,y:CQD.orig[k].y+dy}}})}
    redraw()}
  else if(UI.tmp.length&&e.target.closest&&e.target.closest('#stg')){UI.hover=cqPt(e);redraw()}
});
const cqUp=()=>{if(CQD){CQD=null;save()}};
window.addEventListener('pointerup',cqUp);window.addEventListener('pointercancel',cqUp);
function bindStage(){
  const svg=$('#stg');if(!svg)return;const c=CQ(UI.cq);
  const pt=e=>cqPt(e);
  c.paths=c.paths||[];
  const find=id=>cqFind(c,id);
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e),g=e.target.closest('[data-id]'),bd=e.target.closest('[data-bend]'),t=UI.tool,drawing=UI.tmp.length>0;
    if(bd&&!g&&!drawing){
      const agora=Date.now();
      if(CQLAST&&CQLAST.k===bd.dataset.bend&&agora-CQLAST.t<450&&c.bends&&c.bends[bd.dataset.bend]){
        delete c.bends[bd.dataset.bend];CQLAST=null;CQD=null;save();redraw();return}
      CQLAST={k:bd.dataset.bend,t:agora};
      const hb=e.target.closest('[data-bh]');
      let idx=hb?+hb.dataset.bh:0;
      if(!hb){
        const ids=bd.dataset.bend.split('|'),A=c.items.find(i=>i.id===ids[0]),B=c.items.find(i=>i.id===ids[1]);
        if(A&&B){const q=bendPts({x:A.x,y:A.y},{x:B.x,y:B.y},(c.bends||{})[bd.dataset.bend]);
          idx=Math.hypot(p.x-q[0].x,p.y-q[0].y)<=Math.hypot(p.x-q[1].x,p.y-q[1].y)?0:1}
      }
      CQD={bend:bd.dataset.bend,bh:idx,p0:p};UI.sel=null;redraw();return}
    if(g&&!drawing){
      UI.sel=g.dataset.id;const o=find(UI.sel),pe=e.target.closest('[data-pt]');
      CQD={p0:p,orig:JSON.parse(JSON.stringify(o)),id:UI.sel,pt:pe?+pe.dataset.pt:null,rot:!!e.target.closest('[data-rot]')};
      redraw();return}
    if(t==='sel'){UI.sel=null;redraw();return}
    if(t==='line'||t==='curve'){
      UI.tmp.push(p);
      if(t==='line'&&UI.tmp.length===2){const l={id:uid(),k:'line',a:UI.tmp[0],b:UI.tmp[1]};c.lines.push(l);UI.tmp=[];UI.sel=l.id;save()}
      if(t==='curve'&&UI.tmp.length===3){const l={id:uid(),k:'curve',a:UI.tmp[0],b:UI.tmp[1],c:UI.tmp[2]};c.lines.push(l);UI.tmp=[];UI.sel=l.id;save()}
      redraw();
    }else if(t==='path'){
      const last=UI.tmp[UI.tmp.length-1];
      if(last&&last.x===p.x&&last.y===p.y){finishPath();return}
      UI.tmp.push(p);redraw();
    }else{
      const mx=Math.max(0,...c.items.map(i=>i.n||0));
      const it={id:uid(),t:t==='cav'?'cav':t,x:p.x,y:p.y,r:90};if(it.t!=='cav')it.n=mx+1;c.items.push(it);UI.sel=it.id;save();redraw()}
  });
}
function delSel(){const c=CQ(UI.cq);if(!c||!UI.sel)return;c.items=c.items.filter(i=>i.id!==UI.sel);c.lines=c.lines.filter(l=>l.id!==UI.sel);c.paths=(c.paths||[]).filter(l=>l.id!==UI.sel);fixNums(c);UI.sel=null;save();redraw()}
function finishPath(){const c=CQ(UI.cq);if(!c)return;c.paths=c.paths||[];if(UI.tmp.length>=2){const l={id:uid(),pts:UI.tmp.slice()};c.paths.push(l);UI.sel=l.id;save()}UI.tmp=[];UI.hover=null;redraw()}
function autoPath(){const c=CQ(UI.cq);if(!c)return;const n=numbered(c);if(n.length<2)return;c.paths=c.paths||[];const l={id:uid(),pts:n.map(i=>({x:i.x,y:i.y}))};c.paths.push(l);UI.sel=l.id;save();redraw()}

async function saveBlob(blob,filename){
  try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:filename,data:blob});return}}
  catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function fechamento(m){
  const mens=S.pag.filter(p=>p.ref===m);
  const vMens=mens.reduce((s,p)=>s+(+p.valor||0),0);
  const rMens=mens.filter(p=>p.status==='confirmado').reduce((s,p)=>s+(+p.valor||0),0);
  const prop=partHorses().map(h=>({h:h,r:resumoMes(h.id,m)})).filter(x=>x.r.tot>0);
  const vProp=prop.reduce((s,x)=>s+x.r.tot,0);
  const rProp=prop.reduce((s,x)=>s+(x.r.tot-x.r.aberto),0);
  const saidas=S.fin.filter(f=>f.comp===m).sort((a,b)=>String(a.pag).localeCompare(String(b.pag)));
  const vSai=saidas.reduce((s,f)=>s+total(f),0);
  const rSai=saidas.filter(f=>f.pago).reduce((s,f)=>s+total(f),0);
  const porIns={},porForn={};
  saidas.forEach(f=>{porIns[f.ins||'—']=(porIns[f.ins||'—']||0)+total(f);porForn[f.forn||'—']=(porForn[f.forn||'—']||0)+total(f)});
  return {m:m,mens:mens,prop:prop,saidas:saidas,porIns:porIns,porForn:porForn,
    vMens:vMens,rMens:rMens,vProp:vProp,rProp:rProp,
    vEnt:vMens+vProp,rEnt:rMens+rProp,vSai:vSai,rSai:rSai,
    res:(vMens+vProp)-vSai,resCaixa:(rMens+rProp)-rSai};
}
function mesesDoAno(ano){
  const l=[];for(let i=1;i<=12;i++)l.push(ano+'-'+pad(i));return l;
}
function csvFech(m){
  const f=fechamento(m),sep=';';
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const num=v=>'"'+(+v||0).toFixed(2).replace('.',',')+'"';
  const L=[['Tipo','Data','Competência','Origem ou fornecedor','Categoria','Cavalo','Descrição','Quantidade','Valor unitário','Valor total','Situação'].map(q).join(sep)];
  f.mens.forEach(p=>L.push(['Entrada',p.paidAt?fmtD(p.paidAt):'',monthLabel(p.ref),stName(p.student),'Mensalidade de aluno','',p.desc||'Mensalidade',1,p.valor,p.valor,
    p.status==='confirmado'?'Recebido':p.status==='enviado'?'A conferir':'Em aberto'].map((v,i)=>(i>=7&&i<=9)?num(v):q(v)).join(sep)));
  f.prop.forEach(x=>x.r.l.forEach(y=>L.push(['Entrada',y.pag?fmtD(y.pag):'',monthLabel(m),x.h.owner||x.h.name,'Conta de proprietário · '+(y.ins||''),x.h.name,y.desc||y.ins,y.qtd||1,y.unit,total(y),
    y.pago?'Recebido':'Em aberto'].map((v,i)=>(i>=7&&i<=9)?num(v):q(v)).join(sep))));
  f.saidas.forEach(y=>L.push(['Saída',y.pag?fmtD(y.pag):'',monthLabel(y.comp),y.forn||'',y.ins||'',y.horse?hn(y.horse):'Geral',y.desc||'',y.qtd||1,y.unit,total(y),
    y.pago?'Pago':'Em aberto'].map((v,i)=>(i>=7&&i<=9)?num(v):q(v)).join(sep)));
  L.push('');
  L.push([q('Resumo'),q(''),q(''),q(''),q(''),q(''),q(''),q(''),q(''),q(''),q('')].join(sep));
  [['Entradas previstas',f.vEnt],['Entradas recebidas',f.rEnt],['Saídas lançadas',f.vSai],['Saídas pagas',f.rSai],['Resultado do mês',f.res],['Resultado de caixa',f.resCaixa]]
    .forEach(r=>L.push([q(r[0]),q(''),q(''),q(''),q(''),q(''),q(''),q(''),q(''),num(r[1]),q('')].join(sep)));
  const blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  return saveBlob(blob,'lancamentos-'+slug((HIP()||{}).fantasia||'hipica')+'-'+m+'.csv');
}

const ITENS_FIXOS=[['amb','Utilização do ambiente'],['baia','Baia'],['piq','Piquete'],
  ['feno','Feno'],['trat','Tratador'],['racao','Ração']];
const ITENS_OPC=[['vet','Veterinário'],['ferr','Ferrageamento'],['trein','Treinamento']];
const ADICIONAIS=['Exame AIE e Mormo','Extras veterinários','Extras medicamentos','Extras procedimento',
  'Transporte para prova','Diária do tratador em prova','Material de limpeza do cavalo','Material de limpeza de couro'];
const NOME_ITEM={};ITENS_FIXOS.concat(ITENS_OPC).forEach(x=>NOME_ITEM[x[0]]=x[1]);
function mensDe(h){
  const m=Object.assign({},(h&&h.mens)||{});
  if(!m.baia&&+((h||{}).baia)>0)m.baia=+h.baia;   /* compatível com a versão anterior */
  return m;
}
function totalMens(m){return ITENS_FIXOS.concat(ITENS_OPC).reduce((t,x)=>t+(+m[x[0]]||0),0)}
const ehPart=h=>!!(h&&h.part);
const partHorses=()=>S.horses.filter(ehPart);
const GRUPO_INS={'Baia':'Baia','Ração':'Alimentação','Feno':'Alimentação','Veterinário':'Saúde','Ferragens':'Casqueamento e ferragens'};
const grupoIns=i=>GRUPO_INS[i]||'Outros';
function mensVale(h,m){
  const ini=(h&&h.mensDesde)||TODAY.slice(0,7);
  return m>=ini&&m<=TODAY.slice(0,7);
}
function despMes(hid,m){
  const manuais=S.fin.filter(f=>f.horse===hid&&f.comp===m);
  const h=H(hid),mens=mensVale(h,m)?mensDe(h):{},hipN=(HIP()||{}).fantasia||'';
  const auto=[];
  const monta=(par,bloco)=>par.forEach(x=>{
    const v=+mens[x[0]]||0;
    if(v<=0)return;
    if(manuais.some(f=>f.ins===x[1]))return;       /* lançamento à mão manda */
    auto.push({id:'au-'+x[0]+'-'+hid+'-'+m,ins:x[1],desc:x[1],forn:hipN,horse:hid,comp:m,
               pag:'',unit:v,qtd:1,pago:false,auto:true,bloco:bloco});
  });
  monta(ITENS_FIXOS,'fixo');monta(ITENS_OPC,'opc');
  const marcados=manuais.map(f=>Object.assign({},f,{bloco:blocoDoIns(f.ins)}));
  return auto.concat(marcados);
}
function blocoDoIns(ins){
  if(ITENS_FIXOS.some(x=>x[1]===ins))return 'fixo';
  if(ITENS_OPC.some(x=>x[1]===ins))return 'opc';
  return 'add';
}
const BLOCO_NOME={fixo:'Mensalidade fixa',opc:'Opcionais',add:'Adicionais do mês'};
function resumoMes(hid,m){
  const l=despMes(hid,m),g={fixo:0,opc:0,add:0};let t=0,ab=0;
  l.forEach(x=>{const v=total(x);t+=v;if(!x.pago)ab+=v;const b=x.bloco||'add';g[b]=(g[b]||0)+v});
  return {l:l,g:g,tot:t,aberto:ab,
    por:b=>l.filter(x=>(x.bloco||'add')===b)};
}

  useTenant(p.hipica_id);if(!S)return null;

  if(p.papel==='instrutor'&&(S.instrs||[]).some(x=>x.id===p.ref_id))return {role:'instrutor',id:p.ref_id,hid:p.hipica_id};

async function checarVersao(){
  try{
    const base=location.pathname.replace(/[^/]*$/,'');
    const r=await fetch(base+'versao.txt?x='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    if(!v)return;
    if(v===APPV){try{sessionStorage.removeItem('equi.rl')}catch(e){}return}
    let j=0;try{j=+(sessionStorage.getItem('equi.rl')||0)}catch(e){}
    if(j>=2)return;
    try{sessionStorage.setItem('equi.rl',String(j+1))}catch(e){}
    location.reload(true);
  }catch(e){}
}

let RECTOK=null,RECMSG='';
function hashPars(){
  const h=String(location.hash||'').replace(/^#/,'');const o={};
  if(!h)return o;
  h.split('&').forEach(par=>{const i=par.indexOf('=');if(i>0){try{o[decodeURIComponent(par.slice(0,i))]=decodeURIComponent(par.slice(i+1).replace(/\+/g,' '))}catch(e){}}});
  return o;
}
function limpaHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(_){}}}
function destinoRec(){
  const h=location.hostname||'';
  return /(^|\.)equialtaris\.com\.br$/.test(h)?location.origin+location.pathname:'';
}
async function authRecover(email){
  const d=destinoRec();
  const url=SB_URL+'/auth/v1/recover'+(d?'?redirect_to='+encodeURIComponent(d):'');
  try{
    const r=await fetch(url,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    if(!r.ok){const t=await r.text();
      if(/rate|limit|too many/i.test(t))return {erro:'Muitos pedidos seguidos. Espere alguns minutos e tente de novo.'};
      return {erro:'Não consegui enviar o e-mail agora. Tente mais tarde.'}}
    return {ok:true};
  }catch(e){return {erro:'Sem conexão com o servidor.'}}
}
async function trocarSenhaRec(nova){
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',
      headers:{apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+RECTOK},
      body:JSON.stringify({password:nova})});
    if(!r.ok){const t=await r.text();
      if(/different from the old|same.*password/i.test(t))return {erro:'Escolha uma senha diferente da anterior.'};
      if(/weak|short/i.test(t))return {erro:'Essa senha é fraca demais. Use pelo menos 8 caracteres.'};
      return {erro:'Este link não vale mais. Peça um novo na tela de entrada.'}}
    try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+RECTOK}})}catch(e){}
    return {ok:true};
  }catch(e){return {erro:'Sem conexão com o servidor.'}}
}
function checarLinkRecuperacao(){
  const h=hashPars();
  if(h.error_description||h.error){
    RECMSG=/expired|invalid/i.test(h.error_code||h.error_description||'')
      ?'Esse link de recuperação expirou. Peça um novo abaixo.'
      :'Não consegui validar esse link. Peça um novo abaixo.';
    UI.lgMode='esqueci';limpaHash();return true;
  }
  if(h.type==='recovery'&&h.access_token){
    RECTOK=h.access_token;UI.lgMode='nova';limpaHash();return true;
  }
  return false;
}
async function doLogin(){
  const em=V('lg-e').trim(),pw=V('lg-p'),er=$('#lg-err');
  if(!em||!pw){er.textContent='Informe o e-mail e a senha.';return}
  er.textContent='Entrando…';
  const r=await authSignIn(em,pw);
  if(r.err){er.textContent=r.err==='rede'?'Sem conexão com o servidor. Tente de novo.':'E-mail ou senha incorretos.';return}
  const p=await loadPerfil();
  if(!p){authClear();er.textContent='Esta conta ainda não está liberada. Fale com o EquiAltaris.';return}
  AUTH.perfil=p;
  const okPull=await syncPull();await loadACC();try{await loadMeuPerfil()}catch(e){}try{await loadAvisos()}catch(e){}try{await loadAceites()}catch(e){}try{await loadPresenca()}catch(e){}
  const u=userFromPerfil(p);
  if(!u){authClear();
    er.textContent=okPull?'Seu cadastro não foi encontrado na hípica. Fale com o EquiAltaris.'
                         :'Não consegui carregar seus dados agora. Atualize a página com Ctrl+Shift+R e tente de novo.';
    return}
  UI.logoState=null;UI.user=u;UI.view=homeView(u);UI.cq=null;render();
}

function readImage(file){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type))return rej('Envie uma imagem (JPG ou PNG).');
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>rej('Não foi possível ler a imagem.');im.src=fr.result};
  fr.onerror=()=>rej('Falha ao ler o arquivo.');fr.readAsDataURL(file)})}
async function viewFile(id){let f=(S&&S.files&&S.files[id])||G.files[id];
  if(!f&&id&&S&&SYNC.ready){modal({title:'Comprovante',body:'<p class="muted">Carregando o comprovante…</p>'});await arquivosCarregar([id]);f=S.files[id]}
  if(!f){modal({title:'Comprovante',body:'<div class="note"><b>Este comprovante foi arquivado.</b><br>A imagem saiu do sistema para liberar espaço e está no arquivo XML do mês, guardado pela hípica.</div>'});return}modal({title:'Comprovante',wide:true,body:'<img class="rcp" src="'+f.data+'" alt="'+esc(f.name)+'"><p class="muted sm">'+esc(f.name)+'</p>'})}
