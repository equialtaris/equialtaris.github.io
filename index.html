<style>
/* Layout: sidebar de módulos à esquerda, área de trabalho à direita; no celular a barra vira faixa horizontal no topo. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface2:#f5f7fa; --ink:#141b29; --muted:#5a6578; --line:#dbe0e8;
  --side:#111a2b; --side-ink:#c9d1df; --side-on:#ffffff;
  --accent:#d6a03a; --primary:#2447c8; --primary-ink:#ffffff; --sand:#f3efe3; --grid:#d9d2bd; --jump:#b4541a; --curve:#2447c8;
  --yel:#fde047;--yelink:#3b2a00;--ok:#17825a; --ok-bg:#dff3ea; --warn:#a96a00; --warn-bg:#fbefd2; --bad:#b8352a; --bad-bg:#f8dfdb;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#151d2f; --surface2:#1b2539; --ink:#e8ecf4; --muted:#9aa6bb; --line:#27324a;
  --side:#0a0f1b; --side-ink:#a9b4c9; --primary:#6c8cff; --primary-ink:#0b1020; --sand:#232a38; --grid:#34405a; --jump:#e0884a; --curve:#7fa0ff;
  --yel:#a16207;--yelink:#fffbeb;--ok:#4cc995; --ok-bg:#173a2d; --warn:#e8b04a; --warn-bg:#3d2f10; --bad:#ef7d72; --bad-bg:#432019; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d2f; --surface2:#1b2539; --ink:#e8ecf4; --muted:#9aa6bb; --line:#27324a;
  --side:#0a0f1b; --side-ink:#a9b4c9; --primary:#6c8cff; --primary-ink:#0b1020; --sand:#232a38; --grid:#34405a; --jump:#e0884a; --curve:#7fa0ff;
  --yel:#a16207;--yelink:#fffbeb;--ok:#4cc995; --ok-bg:#173a2d; --warn:#e8b04a; --warn-bg:#3d2f10; --bad:#ef7d72; --bad-bg:#432019; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--side-on)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink)}
.brand.logo{justify-content:center;padding:2px 8px 0}
.brand.logo img{width:150px;height:auto;display:block;border-radius:10px}
.flip{width:150px;height:119px;perspective:900px}
.fl-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.25,1)}
.flip.go .fl-in{transform:rotateY(180deg)} .flip.nt .fl-in{transition:none}
.fl-f,.fl-b{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.brand.logo .fl-f{width:100%;height:100%;object-fit:contain}
.fl-b{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:transparent;border-radius:12px;padding:0;overflow:hidden}
.brand.logo .fl-b img{width:100%;height:100%;object-fit:contain}
@media (prefers-reduced-motion:reduce){.fl-in{transition:none}}
.lgprev{width:150px;height:120px;background:var(--side);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden} .lgprev img{max-width:100%;max-height:100%;object-fit:contain}
.lgl{background:#010b30;border-radius:12px;padding:6px 0;display:flex;justify-content:center}
.lgl img{width:230px;height:auto;display:block}
.stable{margin:0 8px;padding:9px 11px;border:1px solid #ffffff22;border-radius:8px;font-size:12px}
.stable b{display:block;color:var(--side-on);font-size:13px}
nav{display:flex;flex-direction:column;gap:2px}
#side nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin-right:-6px;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}
#side nav::-webkit-scrollbar{width:6px}#side nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px}#side nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45)}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:9px 10px;border-radius:7px;cursor:pointer;text-align:left;font-weight:500}
nav button svg{width:17px;height:17px;flex:none}

nav button:hover{background:#ffffff12}
nav button[aria-current="page"]{background:var(--accent);color:#1a1405;font-weight:700}
.trial{margin-top:auto;padding:10px 12px;border-radius:8px;background:#ffffff10;font-size:12px}
.trial b{color:var(--side-on)}
main{padding:24px clamp(16px,3vw,36px) 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:28px}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.brass{background:var(--accent);border-color:var(--accent);color:#1a1405}
.btn.danger{color:var(--bad)}
/* dashboard */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.lgs{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--muted)} .dvlg{display:inline-flex;align-items:center;gap:6px} .dvlg i,.dnl i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dn{display:flex;align-items:center;gap:24px;flex-wrap:wrap} .dnl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:170px} .dnl li{display:flex;align-items:center;gap:8px} .dnl li b{margin-left:auto;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column;gap:12px;margin-top:6px} .hbr{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:10px} .hbl{font-size:13px;line-height:1.2} .hbt{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden} .hbt i{display:block;height:100%;border-radius:0 4px 4px 0} .hbv{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;display:none}
[data-tip]{cursor:default}
a.btn{text-decoration:none;color:var(--ink,inherit);display:inline-flex;align-items:center}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.cell button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font-size:16px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.kpi b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.tabs{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}
.tw{overflow:auto;max-height:min(70vh,620px);border:1px solid var(--line);border-radius:12px;background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.tw.nolim{max-height:none;overflow-y:visible;overflow-x:auto}
.tw thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.tw::-webkit-scrollbar{width:10px;height:10px}.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}.tw::-webkit-scrollbar-thumb:hover{background:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:0;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button.pill{cursor:pointer}
.muted{color:var(--muted)} .sm{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fg .full{grid-column:1/-1}
/* modal */
.ov{position:fixed;inset:0;background:#0b1020aa;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.md{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:22px;box-shadow:0 20px 60px #0006}
.md.wide{width:min(760px,100%)}
.md h3{font-size:19px;margin-bottom:14px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.act .sp{margin-right:auto}
pre.zap{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;margin:0;max-height:48vh;overflow:auto}
/* programação */
.wk{min-width:980px}
.wk th.hd{text-align:center}
.wk th.today{background:var(--accent);color:#1a1405}
.wk td{vertical-align:top;min-width:128px;padding:6px}
.wk td.hz{min-width:90px;background:var(--surface2)}
.wk td.hz b{display:block;font-size:14px}
.wk td.tdy{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.tr{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;background:var(--surface);font-size:12.5px}
.tr.done{background:var(--ok-bg);border-color:transparent}
.tr input{width:auto;margin-top:2px;accent-color:var(--ok)}
.tr button{background:none;border:0;text-align:left;cursor:pointer;padding:0;line-height:1.3}
.tr b{display:block}
.tr em{font-style:normal;color:var(--jump);font-size:11.5px;font-weight:600}
.addt{width:100%;border:1px dashed var(--line);background:none;border-radius:7px;padding:4px;color:var(--muted);cursor:pointer;font-size:12px}
.addt:hover{border-color:var(--primary);color:var(--primary)}
/* croquis */
.pista{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;touch-action:none;background:var(--sand)}
.cq{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cq .card{padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.cq .card:hover{border-color:var(--primary)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools .btn{text-align:left}
.tools .btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.dist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.dist li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.s-ob{fill:var(--jump)} .s-post{fill:var(--ink)} .s-cav{fill:var(--muted)}
.s-sel{stroke:var(--primary);stroke-width:.25;fill:none;stroke-dasharray:.6 .4}
.s-lbl{font-size:1.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sand);stroke-width:.5px;font-family:var(--f-body)}
.s-dst{font-size:1.3px;fill:var(--muted);paint-order:stroke;stroke:var(--sand);stroke-width:.5px;font-family:var(--f-body)}
/* gráficos */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.bar i{display:block;height:15px;border-radius:3px;background:var(--primary);min-width:2px}
.bar.o i{background:var(--accent)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.vb{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.vb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;min-width:0}
.vb i{width:100%;max-width:56px;background:var(--primary);border-radius:4px 4px 0 0;display:block}
.vb span{color:var(--muted);font-size:11px;text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hz-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hz-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hz-list li:last-child{border:0}
.horse{display:flex;flex-direction:column;gap:10px}
.horse h3{display:flex;justify-content:space-between;align-items:center}
.spark{width:100%;height:54px}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.rep{max-width:760px}
.rep h2{font-size:24px;margin-bottom:2px}
.rep .hd{border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
.rep section{margin-bottom:20px}
.rep h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lg{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--side);position:relative;overflow:hidden}
.lgbg{position:absolute;inset:0;z-index:0}.lgbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,38,.55),rgba(11,18,38,.72))}
.lgsl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;text-decoration:none}.lgsl.on{opacity:1}
.lgsl .pcap{position:absolute;left:20px;bottom:16px;z-index:2;color:#fff;font-size:12px;letter-spacing:.06em;opacity:.85;text-shadow:0 1px 6px #000a}.lgsl .pcap::before{content:"Parceiro · "}
.lgc{position:relative;z-index:1}
.pstrip{position:relative;margin-top:22px;border-radius:12px;overflow:hidden;opacity:.92}
.pstrip{margin-left:auto;margin-right:auto}.pslides{position:relative;border-radius:12px;overflow:hidden;background:var(--surface2)}.pbdg{font-size:11px;color:var(--muted)}
.ps{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease;text-decoration:none;filter:saturate(.9)}.ps.on{opacity:1}
.ps::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 60%)}
.ps .pcap{position:absolute;left:14px;bottom:10px;z-index:2;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px #0008}
.ptag{position:absolute;top:8px;right:10px;z-index:3;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;opacity:.75;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:99px}
.pdrop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:22px;margin-bottom:16px;border:2px dashed var(--line,#3a4260);cursor:pointer;position:relative}.pdrop:hover{border-color:var(--gold,#d9a441)}.pdrop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.pcard{padding:0;overflow:hidden}.pth{height:130px;background-size:cover;background-position:center}.pbd{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.bprev img{max-height:140px;object-fit:contain!important;background:var(--surface2)}.pslot{margin-bottom:6px}.pprev img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px}
.lgc{background:var(--surface);border-radius:16px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0006}
.lgc .brand{color:var(--ink);padding:0}
.lgc .brand small{color:var(--muted)}
.lgc .tabs{margin:0;width:100%}
.lgc .tabs button{flex:1}
.demo{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.demo code{color:var(--ink);font-weight:600;word-break:break-all}
.err{color:var(--bad);font-size:13px;min-height:18px}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.rcp{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block;margin:8px 0;background:#fff}
.pixbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:16px}
.pixbox code{font-weight:700;word-break:break-all}
.pixbox span{color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.hero h2{font-size:22px}
.note{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.gr table{min-width:760px}
.gr th{background:var(--side);color:#fff;text-align:center;font-size:12px;letter-spacing:.05em}
.gr td{padding:0;border:1px solid var(--line);text-align:center;height:34px}
.gr td.tm{background:var(--surface2);font-weight:700;width:70px}
.gr td.hs{background:var(--side);color:#fff;font-weight:700;font-size:12px;width:78px}
.gc{width:100%;height:100%;min-height:34px;border:0;background:none;cursor:pointer;font-size:12.5px;padding:2px 6px}
.gc.occ{background:var(--ok-bg);color:var(--ink)}
.gc.rm{background:var(--yel);color:var(--yelink);font-weight:600}
.pill.yl{background:var(--yel);color:var(--yelink)}
.gc.vg{background:transparent;color:var(--warn);font-weight:700;outline:1px dashed var(--accent);outline-offset:-3px}
.gc.em{color:var(--muted);opacity:.4}.gc.em:hover{opacity:1;background:var(--surface2)}
.per{background:var(--side);color:#fff;text-align:center;font-family:var(--f-display);font-size:20px;letter-spacing:.12em;padding:10px;border-radius:8px;margin:18px 0 8px}
.chat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;height:min(66vh,580px);min-width:0}
.chat .hd2{padding:12px 16px;border-bottom:1px solid var(--line)}
.chat .hd2 b{display:block}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{display:flex}.msg.me{justify-content:flex-end}
.bb{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface2);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bb{background:var(--primary);color:var(--primary-ink)}
.tm2{display:block;font-size:10.5px;opacity:.7;text-align:right;margin-top:2px}
.dsep{align-self:center;font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 10px;border-radius:99px;margin:6px 0}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cin input{flex:1}
.chs{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.sl{display:flex;flex-direction:column;gap:6px}
.sl button{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.sl button[aria-current="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.sl button span{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sl small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){.chs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .brand.logo{justify-content:flex-start}.brand.logo img{width:auto;height:64px}.flip{width:80px;height:64px}.brand.logo .fl-f{width:100%;height:100%}
  #side{position:static;height:auto;flex-direction:column;align-items:stretch;padding:10px 12px;gap:8px;min-width:0}
  .stable,.trial{display:none}
  nav,#side nav{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;min-width:0;padding-bottom:2px;margin-right:0;padding-right:0}
  nav button{white-space:nowrap;padding:7px 10px}
  .ed{grid-template-columns:1fr}
  .top h1{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){.md{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}

function fld(label,id,val,type,opts,cls){
  val=val==null?'':val;let c;
  if(type==='select'){c='<select id="'+id+'">'+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select>'}
  else if(type==='textarea'){c='<textarea id="'+id+'">'+esc(val)+'</textarea>'}
  else if(type==='list'){c='<input id="'+id+'" list="'+id+'L" value="'+esc(val)+'" autocomplete="off"><datalist id="'+id+'L">'+opts.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>'}
  else c='<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(opts?' '+opts:'')+'>';
  return '<label class="f '+(cls||'')+'">'+esc(label)+c+'</label>';
}
const V=id=>{const e=document.getElementById(id);return e?e.value:''};
function modal(o){
  const root=$('#modal');
  root.innerHTML='<div class="ov" data-ov><div class="md'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><h3>'+esc(o.title)+'</h3><div>'+o.body+'</div><div class="act">'+
   (o.del?'<button class="btn danger sp" id="m-del">Excluir</button>':'')+
   '<button class="btn" id="m-x">'+(o.save?'Cancelar':'Fechar')+'</button>'+(o.save?'<button class="btn pri" id="m-ok">'+(o.label||'Salvar')+'</button>':'')+(o.extra||'')+'</div></div></div>';
  const close=()=>{root.innerHTML=''};
  $('#m-x').onclick=close;
  root.querySelector('[data-ov]').addEventListener('mousedown',e=>{if(e.target.hasAttribute('data-ov'))close()});
  if(o.save)$('#m-ok').onclick=()=>{if(o.save()!==false){close();save();render()}};
  if(o.del)$('#m-del').onclick=()=>{o.del();close();save();render()};
  const first=root.querySelector('input,select,textarea');if(first&&!o.noFocus)first.focus();
  if(o.after)o.after(close);

}

function copyText(txt,btn){
  const ok=()=>{if(btn){const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1400)}};
  const fb=()=>{const t=document.querySelector('pre.zap');if(t){const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r)}if(btn)btn.textContent='Selecionado: use Ctrl+C'};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}

function bars(it){return it.t==='vert'?[0]:it.t==='oxer'?[-.6,.6]:it.t==='triplo'?[-.9,0,.9]:[0]}
function shape(it){
  if(it.t==='cav')return '<rect class="s-cav" x="-1.3" y="-.12" width="2.6" height=".24" rx=".05"/>';
  const b=bars(it);let s='';
  b.forEach(y=>{s+='<rect class="s-ob" x="-1.75" y="'+(y-.12)+'" width="3.5" height=".24"/>'});
  const y0=b[0],y1=b[b.length-1];
  [y0,y1].forEach(y=>[-1.9,1.9].forEach(x=>{s+='<rect class="s-post" x="'+(x-.17)+'" y="'+(y-.17)+'" width=".34" height=".34"/>'}));
  return s;
}
function qlen(l){let L=0,p=l.a;for(let i=1;i<=40;i++){const t=i/40,u=1-t;const q={x:u*u*l.a.x+2*u*t*l.c.x+t*t*l.b.x,y:u*u*l.a.y+2*u*t*l.c.y+t*t*l.b.y};L+=Math.hypot(q.x-p.x,q.y-p.y);p=q}return L}
function llen(l){return l.k==='curve'?qlen(l):Math.hypot(l.b.x-l.a.x,l.b.y-l.a.y)}
function numbered(c){return c.items.filter(i=>i.t!=='cav')}
function dists(c){const n=numbered(c),o=[];for(let i=1;i<n.length;i++)o.push({a:i,b:i+1,d:Math.hypot(n[i].x-n[i-1].x,n[i].y-n[i-1].y),p:[n[i-1],n[i]]});return o}
function croquiSVG(c,o){
  o=o||{};const W=c.W,Hh=c.H;let s='<svg class="pista" viewBox="0 0 '+W+' '+Hh+'" '+(o.id?'id="'+o.id+'"':'')+' role="img" aria-label="Croqui '+esc(c.name)+'">'+
   '<defs><pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0H0V5" fill="none" stroke="var(--grid)" stroke-width=".08"/></pattern></defs>'+
   '<rect width="'+W+'" height="'+Hh+'" fill="var(--sand)"/><rect width="'+W+'" height="'+Hh+'" fill="url(#g5)"/><rect x=".1" y=".1" width="'+(W-.2)+'" height="'+(Hh-.2)+'" fill="none" stroke="var(--ink)" stroke-width=".3"/>';
  if(o.showDist!==false)dists(c).forEach(d=>{s+='<line x1="'+d.p[0].x+'" y1="'+d.p[0].y+'" x2="'+d.p[1].x+'" y2="'+d.p[1].y+'" stroke="var(--muted)" stroke-width=".12" stroke-dasharray=".6 .5"/><text class="s-dst" text-anchor="middle" x="'+((d.p[0].x+d.p[1].x)/2)+'" y="'+((d.p[0].y+d.p[1].y)/2-.5)+'">'+num(d.d)+' m</text>'});
  c.lines.forEach(l=>{
    const sel=o.sel===l.id;
    const d=l.k==='curve'?'M'+l.a.x+' '+l.a.y+' Q'+l.c.x+' '+l.c.y+' '+l.b.x+' '+l.b.y:'M'+l.a.x+' '+l.a.y+' L'+l.b.x+' '+l.b.y;
    const mid=l.k==='curve'?{x:.25*l.a.x+.5*l.c.x+.25*l.b.x,y:.25*l.a.y+.5*l.c.y+.25*l.b.y}:{x:(l.a.x+l.b.x)/2,y:(l.a.y+l.b.y)/2};
    s+='<g data-id="'+l.id+'" style="cursor:'+(o.sel!==undefined?'move':'default')+'"><path d="'+d+'" fill="none" stroke="transparent" stroke-width="2.4"/><path d="'+d+'" fill="none" stroke="'+(sel?'var(--primary)':'var(--curve)')+'" stroke-width=".28"/>'+
      '<circle cx="'+l.a.x+'" cy="'+l.a.y+'" r=".45" fill="var(--curve)"/><circle cx="'+l.b.x+'" cy="'+l.b.y+'" r=".45" fill="var(--curve)"/>'+
      '<text class="s-lbl" text-anchor="middle" x="'+mid.x+'" y="'+(mid.y-.8)+'">'+num(llen(l))+' m</text></g>';
  });
  let n=0;
  c.items.forEach(it=>{
    const num_=it.t==='cav'?0:++n;
    s+='<g data-id="'+it.id+'" style="cursor:'+(o.sel!==undefined?'move':'default')+'"><g transform="translate('+it.x+' '+it.y+') rotate('+it.r+')">'+shape(it)+
      '<rect x="-2.3" y="-1.5" width="4.6" height="3" fill="transparent"/>'+(o.sel===it.id?'<rect class="s-sel" x="-2.4" y="-1.5" width="4.8" height="3"/>':'')+'</g>'+
      (num_?'<text class="s-lbl" text-anchor="middle" x="'+it.x+'" y="'+(it.y-2.4)+'">'+num_+'</text>':'')+'</g>';
  });
  (o.tmp||[]).forEach(p=>{s+='<circle cx="'+p.x+'" cy="'+p.y+'" r=".5" fill="var(--primary)"/>'});
  if(o.tmp&&o.tmp.length&&o.hover){const t=o.tmp.concat([o.hover]);s+='<polyline points="'+t.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--primary)" stroke-width=".18" stroke-dasharray=".5 .4"/>'}
  return s+'</svg>';
}

  rows.forEach(r=>{

   '<button class="btn danger" data-act="cqdel">Excluir croqui</button></div></div>';
}
function hint(){const t=UI.tool;return t==='sel'?'Arraste os obstáculos para posicionar. Delete remove o selecionado.':t==='line'?'Clique em dois pontos para medir uma linha reta.':t==='curve'?'Clique no início, no fim e depois no ponto que define a curvatura.':'Clique na pista para colocar o obstáculo. Os números seguem a ordem de colocação.'}
function distList(c){const d=dists(c);let s=d.map(x=>'<li><span>'+x.a+' → '+x.b+'</span><b>'+num(x.d)+' m</b></li>').join('');
  c.lines.forEach((l,i)=>{s+='<li><span>'+(l.k==='curve'?'Curva':'Reta')+' '+(i+1)+'</span><b>'+num(llen(l))+' m</b></li>'});return s||'<li class="muted">Coloque dois obstáculos para ver a distância.</li>'}
function redraw(){const c=CQ(UI.cq);if(!c)return;$('#stage').innerHTML=croquiSVG(c,{id:'stg',sel:UI.sel,tmp:UI.tmp,hover:UI.hover,showDist:UI.showDist});$('#dl').innerHTML=distList(c);$('#hint').textContent=hint();bindStage()}
function snap(v){return Math.round(v*2)/2}
function bindStage(){
  const svg=$('#stg');if(!svg)return;const c=CQ(UI.cq);let drag=null;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(0,Math.min(c.W,snap(q.x))),y:Math.max(0,Math.min(c.H,snap(q.y)))}};
  const find=id=>c.items.find(i=>i.id===id)||c.lines.find(l=>l.id===id);
  svg.addEventListener('pointerdown',e=>{
    const p=pt(e),g=e.target.closest('[data-id]'),t=UI.tool;
    if(t==='sel'){
      if(g){UI.sel=g.dataset.id;const o=find(UI.sel);drag={p0:p,orig:JSON.parse(JSON.stringify(o)),id:UI.sel};try{svg.setPointerCapture(e.pointerId)}catch(_){}}else UI.sel=null;
      redraw();
    }else if(t==='line'||t==='curve'){
      UI.tmp.push(p);
      if(t==='line'&&UI.tmp.length===2){const l={id:uid(),k:'line',a:UI.tmp[0],b:UI.tmp[1]};c.lines.push(l);UI.tmp=[];UI.sel=l.id;save()}
      if(t==='curve'&&UI.tmp.length===3){const l={id:uid(),k:'curve',a:UI.tmp[0],b:UI.tmp[1],c:UI.tmp[2]};c.lines.push(l);UI.tmp=[];UI.sel=l.id;save()}
      redraw();
    }else{const it={id:uid(),t:t==='cav'?'cav':t,x:p.x,y:p.y,r:t==='cav'?90:90};c.items.push(it);UI.sel=it.id;save();redraw()}
  });
  svg.addEventListener('pointermove',e=>{
    const p=pt(e);
    if(drag){const o=find(drag.id),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
      if(o.t){o.x=drag.orig.x+dx;o.y=drag.orig.y+dy}else{['a','b','c'].forEach(k=>{if(o[k]){o[k]={x:drag.orig[k].x+dx,y:drag.orig[k].y+dy}}})}
      redraw()}
    else if(UI.tmp.length){UI.hover=p;redraw()}
  });
  const up=()=>{if(drag){drag=null;save()}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
function delSel(){const c=CQ(UI.cq);if(!c||!UI.sel)return;c.items=c.items.filter(i=>i.id!==UI.sel);c.lines=c.lines.filter(l=>l.id!==UI.sel);UI.sel=null;save();redraw()}

function findUser(){
  const em=V('lg-e').trim().toLowerCase(),pw=V('lg-p');let u=null;
  if(em===G.owner.email.toLowerCase()&&pw===G.owner.pass)u={role:'owner'};
  for(let k=0;k<G.hips.length&&!u;k++){
    const h=G.hips[k],T=G.tenants[h.id];
    if(em===h.login.toLowerCase()&&pw===h.pass)u={role:'staff',hid:h.id};
    else{const ii=T.instrs.find(x=>x.email.toLowerCase()===em&&x.pass===pw);if(ii)u={role:'instrutor',id:ii.id,hid:h.id};
      else{const a=T.students.find(x=>x.email.toLowerCase()===em&&x.pass===pw);if(a)u={role:'aluno',id:a.id,hid:h.id}}}}
  return u;
}
function finishLogin(u){
  if(u.hid)useTenant(u.hid);else S=null;
  UI.logoState=null;UI.user=u;UI.view=u.role==='owner'?'o_dash':u.role==='aluno'?'s_inicio':'painel';UI.cq=null;saveSession();render();
}

function addFile(name,data){const id=uid();S.files[id]={name:name,data:data,at:TODAY};return id}
function readImage(file){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type))return rej('Envie uma imagem (JPG ou PNG).');
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>rej('Não foi possível ler a imagem.');im.src=fr.result};
  fr.onerror=()=>rej('Falha ao ler o arquivo.');fr.readAsDataURL(file)})}

function dvBars(months){
  const W=560,Hh=250,L=56,B=30,T=14,R=8,pw=W-L-R,ph=Hh-B-T;
  const mx=Math.max(1,...months.map(m=>m.pago+m.conf+m.aberto));
  const step=Math.pow(10,Math.floor(Math.log10(mx))),nice=Math.ceil(mx/step*1.0)*step;
  const top=nice,ticks=[0,.25,.5,.75,1].map(f=>top*f);
  const y=v=>T+ph-(v/top)*ph,bw=Math.min(54,pw/months.length*.5),band=pw/months.length;
  let g='';
  ticks.forEach(t=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"'+(t?' stroke-dasharray="3 3"':'')+'/><text x="'+(L-8)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(t>=1000?(t/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':t)+'</text>'});
  const segs=[['pago','Paga','var(--s1)'],['conf','A conferir','var(--s3)'],['aberto','Em aberto','var(--s2)']];
  months.forEach((m,i)=>{
    const x=L+band*i+(band-bw)/2;let acc=0;
    segs.forEach(sg=>{const v=m[sg[0]];if(!v)return;const y1=y(acc+v),y0=y(acc);
      g+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(2,y0-y1)+'" rx="4" fill="'+sg[2]+'" stroke="var(--surface)" stroke-width="2" data-tip="'+esc(monthLabel(m.ref)+' · '+sg[1]+': '+brl(v))+'"/>';acc+=v});
    g+='<text x="'+(x+bw/2)+'" y="'+(Hh-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+MES[+m.ref.slice(5)-1].slice(0,3)+'</text>';
    if(m.pago+m.conf+m.aberto)g+='<text x="'+(x+bw/2)+'" y="'+(y(acc)-6)+'" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">'+brl(acc).replace(',00','')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Cobranças por mês, divididas em pagas, a conferir e em aberto">'+g+'</svg>';
}
function dvDonut(parts){
  const tot=parts.reduce((t,p)=>t+p.n,0),r=62,C=2*Math.PI*r;let off=0,g='';
  if(!tot)return '';
  parts.forEach(p=>{if(!p.n)return;const len=p.n/tot*C,gap=parts.filter(x=>x.n).length>1?3:0;
    g+='<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="22" stroke-dasharray="'+Math.max(0,len-gap)+' '+(C-len+gap)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)" data-tip="'+esc(p.l+': '+p.n+' hípica(s)')+'"/>';off+=len});
  return '<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Situação das hípicas">'+g+'<text x="90" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor">'+tot+'</text><text x="90" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">hípicas</text></svg>';
}

function readPhoto(f,max){return new Promise((res,rej)=>{
  if(!/^image\//.test(f.type))return rej('Formato não aceito. Envie JPG ou PNG.');
  if(f.size>8*1024*1024)return rej('Arquivo muito pesado ('+(f.size/1048576).toFixed(1).replace('.',',')+' MB). O limite é 8 MB.');
  const fr=new FileReader();fr.onerror=()=>rej('Falha ao ler o arquivo.');
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Não consegui ler essa imagem.');im.onload=()=>{
    if(im.width<1000)return rej('Imagem pequena ('+im.width+' px de largura). Envie uma com pelo menos 1000 px.');
    const k=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(f)})}
function readSlot(f){return new Promise((res,rej)=>{

  const fr=new FileReader();fr.onerror=()=>rej('Falha ao ler o arquivo.');
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Não consegui ler essa imagem.');im.onload=()=>{
    if(im.width<400)return rej('Imagem pequena ('+im.width+' px de largura). Envie uma com pelo menos 400 px.');
    const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');
    x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(1,1,1,1).data;const bg=d[3]<200?'#0f1424':'rgb('+d[0]+','+d[1]+','+d[2]+')';
    if(d[3]<200){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height)}
    res({d:c.toDataURL('image/jpeg',.82),bg:bg,r:c.width/c.height})};im.src=fr.result};fr.readAsDataURL(f)})}

function listModal(title,list,fields,row){
  const body=()=>'<ul class="hz-list">'+(list.length?list.map(x=>'<li><span>'+row(x)+'</span><button class="btn sm danger" data-ldel="'+x.id+'">Remover</button></li>').join(''):'<li class="muted">Nada registrado ainda.</li>')+'</ul><h4 style="margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">Adicionar</h4><div class="fg">'+fields.map(f=>fld(f[0],'lf-'+f[1],f[4]||'',f[2]||'text',f[3],f[5])).join('')+'</div><div class="err" id="l-err" role="alert"></div><div class="row" style="margin-top:8px"><button class="btn brass" id="l-add">Adicionar</button></div>';
  modal({title:title,wide:true,body:body(),noFocus:true,after:()=>{
    const root=$('#modal');let pf=null;
    const wire=()=>{
      const fi=document.getElementById('lf-file');if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;readImage(f).then(d=>{pf={name:f.name,data:d};$('#l-err').textContent=''}).catch(m=>{pf=null;$('#l-err').textContent=m})};
      $('#l-add').onclick=()=>{const o={id:uid()};fields.forEach(f=>{if(f[2]==='file'){if(pf)o.file=addFile(pf.name,pf.data)}else o[f[1]]=V('lf-'+f[1])});if(!o[fields[0][1]]){$('#l-err').textContent='Preencha o primeiro campo.';return}list.push(o);save();pf=null;refresh()};
      root.querySelectorAll('[data-ldel]').forEach(x=>x.onclick=()=>{const i=list.findIndex(y=>y.id===x.dataset.ldel);if(i>=0)list.splice(i,1);save();refresh()});
    };
    const refresh=()=>{root.querySelector('.md>div').innerHTML=body();wire()};
    wire();$('#m-x').addEventListener('click',()=>render());
  }});
}

  hferr:d=>{const h=H(d.id);modal({title:'Registrar ferrageamento · '+h.name,body:'<div class="fg">'+fld('Data realizada','e-d',TODAY,'date')+fld('Próximo ferrageamento','e-p',addDays(TODAY,35),'date')+fld('Ferrador','e-f','Ferrador Lima','text',null,'full')+'</div>',save:()=>{if(!V('e-d'))return false;h.ferr.push({d:V('e-d'),prox:V('e-p')||addDays(V('e-d'),35),ferrador:V('e-f')})}})},
  cqnew:()=>{modal({title:'Novo croqui de salto',body:'<div class="fg">'+fld('Nome do treino','n-n','','text',null,'full')+fld('Largura da pista (m)','n-w',50,'number','min="10" max="120"')+fld('Comprimento da pista (m)','n-h',30,'number','min="10" max="120"')+'</div>',label:'Criar e editar',save:()=>{const c={id:uid(),name:V('n-n').trim()||'Croqui sem nome',desc:'',W:+V('n-w')||50,H:+V('n-h')||30,items:[],lines:[]};S.croquis.push(c);UI.cq=c.id;UI.sel=null;UI.tool='vert';UI.tmp=[]}})},
  cqopen:d=>{UI.cq=d.id;UI.sel=null;UI.tool='sel';UI.tmp=[];render()},
  cqBack:()=>{UI.cq=null;render()},
  tool:d=>{UI.tool=d.t;UI.tmp=[];UI.hover=null;render()},
  rot:d=>{const c=CQ(UI.cq),it=c.items.find(i=>i.id===UI.sel);if(it){it.r=((it.r+ +d.n)%360+360)%360;save();redraw()}},
  ord:d=>{const c=CQ(UI.cq),i=c.items.findIndex(x=>x.id===UI.sel),j=i+ +d.n;if(i>=0&&j>=0&&j<c.items.length){const t=c.items[i];c.items[i]=c.items[j];c.items[j]=t;save();redraw()}},
  delsel:()=>delSel(),
  cqdel:()=>{const c=CQ(UI.cq);modal({title:'Excluir croqui?',body:'<p>“'+esc(c.name)+'” será removido, e os treinos ligados a ele ficam sem croqui.</p>',label:'Excluir',save:()=>{S.croquis=S.croquis.filter(x=>x!==c);S.treinos.forEach(t=>{if(t.croqui===c.id)t.croqui=''});UI.cq=null}})},
  ptab:d=>{UI.provTab=d.t;render()},pnew:()=>provaModal(),pedit:d=>provaModal(S.provas.find(p=>p.id===d.id)),ppen:d=>penModal(S.provas.find(p=>p.id===d.id)),
  ftab:d=>{UI.finTab=d.t;render()},fnew:()=>finModal(),fedit:d=>finModal(S.fin.find(f=>f.id===d.id)),
  fpago:d=>{const f=S.fin.find(x=>x.id===d.id);f.pago=!f.pago;save();render()},
  cobPick:()=>{UI.finTab='cob';UI.view='fin';render()},
  cobCopy:(d,b)=>copyText(cobText(),b),
  reset:()=>modal({title:'Restaurar dados de exemplo?',body:'<p>Todas as hípicas, cobranças e cadastros da plataforma voltam aos dados de exemplo e você sai do sistema.</p>',label:'Restaurar',save:()=>{G=seedG();G.hips.forEach(h=>normT(G.tenants[h.id],h.id==='h1'));ensureFixed();S=null;UI.user=null;UI.cq=null;saveSession()}})
};
function horseModal(h){const isNew=!h;const o=h||{name:'',owner:''};
  modal({title:isNew?'Novo cavalo':'Editar cavalo',body:'<div class="fg">'+fld('Nome','h-n',o.name,'text',null,'full')+fld('Proprietário','h-o',o.owner,'list',owners(),'full')+'</div><div class="err" id="lm-err" role="alert"></div>',del:isNew?null:()=>{S.horses=S.horses.filter(x=>x!==h);S.treinos=S.treinos.filter(t=>t.horse!==h.id)},
   save:()=>{const n=V('h-n').trim();if(!n)return false;if(isNew){const L=hipLim(HIP());if(S.horses.length>=L.c){$('#lm-err').textContent='Limite do plano '+(PLN[HIP().plano]||'Personalizado')+' atingido: '+L.c+' cavalos. Fale com o EquiAltaris para ampliar.';return false}}if(isNew)S.horses.push({id:uid(),name:n,owner:V('h-o').trim(),peso:[],ferr:[]});else{h.name=n;h.owner=V('h-o').trim()}}})}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.closest('#stg'))return;
  if(b.tagName==='INPUT'&&b.type==='checkbox'){act[b.dataset.act](b.dataset,b,e);return}
  if(act[b.dataset.act])act[b.dataset.act](b.dataset,b,e);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cq .card[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='lf'){e.preventDefault();doLogin();return}
  if(e.target.id==='gchf'){e.preventDefault();const t=V('ch-in').trim();if(!t)return;const f=e.target.dataset;G.chat.push({id:uid(),hip:f.h,from:f.f,txt:t.slice(0,1000),at:Date.now(),read:false});save();render();const i=$('#ch-in');if(i)i.focus();return}
  if(e.target.id==='chf'){e.preventDefault();const t=V('ch-in').trim();if(!t)return;const f=e.target.dataset;
    S.msgs.push({id:uid(),student:f.s,canal:f.c,inst:f.c==='instrutor'?f.i:'',from:f.f,txt:t.slice(0,1000),at:Date.now(),read:f.f==='staff'?false:false});save();render();const i=$('#ch-in');if(i)i.focus()}
});
(function(){const tp=document.createElement('div');tp.id='tip';document.body.appendChild(tp);
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tp.textContent=t.getAttribute('data-tip');tp.style.display='block'}else tp.style.display='none'});
  document.addEventListener('mousemove',e=>{if(tp.style.display==='block'){tp.style.left=Math.min(innerWidth-270,e.clientX+12)+'px';tp.style.top=(e.clientY+14)+'px'}});})();
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hq'){UI.hq=t.value;const p=t.selectionStart;render();const n=$('#hq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pix-k'){S.pix=t.value.trim();save();return}
  if(t.id==='hl-f'){const f=t.files[0];if(!f)return;if(!/^image\//.test(f.type)){$('#hl-err').textContent='Formato não aceito. Envie PNG, JPG ou SVG.';return}
    if(f.size>5*1024*1024){$('#hl-err').textContent='Arquivo muito pesado ('+(f.size/1048576).toFixed(1).replace('.',',')+' MB). O limite é 5 MB.';return}
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{if(im.width&&im.width<300&&!/svg/.test(f.type)){$('#hl-err').textContent='Imagem pequena ('+im.width+' px de largura). Envie uma com pelo menos 300 px para não ficar borrada.';return}const k=Math.min(1,420/Math.max(im.width||420,im.height||420)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.width||420)*k));c.height=Math.max(1,Math.round((im.height||420)*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);HIP().logo=c.toDataURL('image/png');UI.logoState='done';save();render()};im.onerror=()=>{$('#hl-err').textContent='Não consegui ler essa imagem.'};im.src=fr.result};fr.readAsDataURL(f);return}
  if(t.id==='pc-multi'){const fs=[].slice.call(t.files);if(!fs.length)return;const errs=[];G.parc=G.parc||[];
    (async()=>{for(const f of fs){if(G.parc.length>=12){errs.push('Limite de 12 parceiros atingido.');break}
      try{const d=await readPhoto(f,1600);G.parc.push({id:uid(),nome:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,40)||'Parceiro',link:'',ativa:true,img:d})}catch(m){errs.push(f.name+': '+m)}}
      save();render();if(errs.length){const e=$('#pc-merr');if(e)e.textContent=errs.join(' · ')}})();return}
  if(t.id==='pc-b'||t.id==='pc-c'){const f=t.files[0];if(!f)return;const al=t.id==='pc-b';readSlot(f).then(r=>{if(al){PCB=r.d;PBA=r.bg;PRA=r.r}else{PCC=r.d;PBC=r.bg;PRC=r.r}$(al?'#pc-bprev':'#pc-cprev').innerHTML='<img src="'+r.d+'" alt="Pré-visualização">';$('#pc-err').textContent=''}).catch(m=>{$('#pc-err').textContent=m});return}
  if(t.id==='pcsz-a'||t.id==='pcsz-c'){G.pcfg[t.id==='pcsz-a'?'aluno':'cavalo']=t.value;save();render();return}
  if(t.id==='pc-f'){const f=t.files[0];if(!f)return;readPhoto(f,1600).then(d=>{PCF=d;$('#pc-prev').innerHTML='<img src="'+d+'" alt="Pré-visualização">';$('#pc-err').textContent=''}).catch(m=>{$('#pc-err').textContent=m});return}
  if(t.id==='ow-tel'){G.owner.tel=telFmt(t.value.trim());save();return}
  if(t.id==='ow-pix'){G.owner.pix=t.value.trim();save();return}
  if(t.id&&t.id.indexOf('pl-')===0&&G.planos[t.id.slice(3)]){G.planos[t.id.slice(3)].v=+t.value||0;save();return}
  if(t.id==='hp-pl'){const p=G.planos[t.value];if(p)$('#hp-v').value=p.v;hpLimUi();return}
  if(t.id==='ip-f'){const f=t.files[0];if(!f)return;readImage(f).then(d=>{IPF={name:f.name,data:d};$('#ip-prev').innerHTML='<img class="rcp" style="max-height:240px" src="'+d+'" alt="Pré-visualização do comprovante">';$('#ip-err').textContent=''}).catch(m=>{IPF=null;$('#ip-prev').innerHTML='';$('#ip-err').textContent=m});return}
  if(t.dataset&&t.dataset.chg){UI[t.dataset.chg]=t.value;render();return}
  if(UI.view==='croquis'&&UI.cq){const c=CQ(UI.cq);if(!c)return;
    if(t.id==='cq-n'){c.name=t.value;save()}
    else if(t.id==='cq-d'){c.desc=t.value;save()}
    else if(t.id==='cq-w'){c.W=Math.max(10,+t.value||c.W);save();redraw()}
    else if(t.id==='cq-h'){c.H=Math.max(10,+t.value||c.H);save();redraw()}
    else if(t.id==='cq-sd'){UI.showDist=t.checked;redraw()}}
});
$('#logoS').src=LOGO;
UI.user=loadSession();
render();
syncPull();setInterval(syncPull,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull()});
})();
</script>
