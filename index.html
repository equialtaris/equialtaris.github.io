DOCS.uso={t:'Termos de Uso',sub:'As regras do contrato entre você e o EquiAltaris',html:function(){return `
<h3>1. Quem somos</h3>
<p>O EquiAltaris é um sistema de gestão para centros de equitação, oferecido pela internet por `+idEmp()+`. Estes Termos regem o uso do sistema pelas hípicas contratantes e por todas as pessoas que acessam o sistema por meio delas.</p>

<h3>2. As palavras que usamos</h3>
<p><b>Plataforma</b> é o sistema EquiAltaris, acessado pelo site equialtaris.com.br. <b>Hípica</b> é o centro de equitação que contrata o plano e responde pelos dados que insere. <b>Usuário</b> é qualquer pessoa com acesso: administração da hípica, instrutor, aluno ou responsável legal de aluno menor de idade. <b>Comunidade</b> é a área em que os usuários publicam conteúdo visível para as demais hípicas do sistema.</p>

<h3>3. Aceitação</h3>
<p>Usar a Plataforma significa concordar com estes Termos e com a Política de Privacidade. O sistema registra quem aceitou, em que data e qual versão do documento. Quem não concorda não deve usar o sistema e deve avisar a hípica para que o acesso seja encerrado.</p>

<h3>4. Conta e senha</h3>
<p>O acesso é pessoal e intransferível. A hípica solicita a criação das contas e o EquiAltaris as libera. Cada usuário responde pelo que acontece na sua conta e deve guardar a senha em sigilo, não compartilhá-la e avisar imediatamente pelo e-mail `+esc(empMail())+` se suspeitar de uso indevido. É proibido criar conta com dados falsos ou em nome de outra pessoa.</p>

<h3>5. Idade mínima e alunos menores de idade</h3>
<p>Maiores de 18 anos usam a Plataforma livremente. Alunos menores de 18 anos só podem ter conta mediante autorização expressa do pai, da mãe ou do responsável legal, registrada no sistema pela hípica antes da liberação do acesso.</p>
<p>A conta de aluno menor de 16 anos fica vinculada ao responsável legal indicado, que acompanha o uso, pode pedir a qualquer momento o histórico ou a exclusão da conta e pode revogar a autorização, hipótese em que o acesso é encerrado. Enquanto não houver autorização registrada, a conta do aluno menor não publica na Comunidade.</p>
<p>Por padrão, o perfil de aluno menor nasce com a configuração de privacidade mais restritiva disponível, não recebe publicidade direcionada e não tem seus dados usados para formação de perfil comercial.</p>

<h3>6. O plano da hípica</h3>
<p>A hípica contrata um plano com limites de alunos e de cavalos e valor mensal, informados na área Meu plano. O pagamento é mensal, na data de vencimento combinada. Havendo atraso, o EquiAltaris pode suspender o acesso até a regularização, sem que isso apague os dados já gravados.</p>

<h3>7. Responsabilidades da hípica</h3>
<p>A hípica garante que os dados que insere são verdadeiros e que tem autorização para inseri-los, inclusive de alunos, proprietários de cavalos e responsáveis legais. Cabe à hípica colher a autorização do responsável de cada aluno menor, manter o cadastro atualizado e encerrar o acesso de quem deixa de fazer parte do centro.</p>

<h3>8. Responsabilidades do usuário</h3>
<p>O usuário se compromete a usar a Plataforma de forma lícita e a não: publicar conteúdo proibido pelas Regras da Comunidade; copiar, raspar ou extrair dados em massa; tentar burlar as proteções do sistema ou acessar a área de outra hípica; usar o sistema para spam, propaganda não autorizada, apostas ou venda de medicamentos; ou prejudicar o funcionamento do serviço.</p>

<h3>9. O conteúdo que você publica</h3>
<p>O que você publica continua sendo seu. Ao publicar, você concede ao EquiAltaris uma licença gratuita e limitada para armazenar e exibir aquele conteúdo dentro da Plataforma, enquanto a publicação existir, apenas para o funcionamento do serviço. Você responde pelo que publica e declara ter os direitos necessários, inclusive a autorização de imagem das pessoas retratadas.</p>

<h3>10. Moderação</h3>
<p>O EquiAltaris pode remover publicação que viole estes Termos ou as Regras da Comunidade, enviar advertência, suspender ou encerrar a conta, conforme a gravidade e a reincidência. Denúncias podem ser enviadas pelo canal de mensagens do sistema ou pelo e-mail `+esc(empMail())+`.</p>
<p>Conteúdo com indício de exploração ou abuso sexual, aliciamento de criança ou adolescente, ou maus-tratos a animais é removido assim que identificado, independentemente de ordem judicial, e comunicado às autoridades competentes, com preservação dos registros pelo prazo legal.</p>

<h3>11. Disponibilidade</h3>
<p>Trabalhamos para manter a Plataforma no ar, mas o serviço pode ser interrompido para manutenção, atualização ou por falha de terceiros que compõem a infraestrutura. Não garantimos funcionamento ininterrupto nem livre de erros.</p>

<h3>12. Os dados são da hípica</h3>
<p>Os registros operacionais pertencem à hípica, que pode exportá-los a qualquer momento. Encerrado o contrato, os dados ficam disponíveis para exportação por 30 dias e depois são excluídos ou anonimizados, salvo o que a lei obrigue a guardar.</p>

<h3>13. A propriedade do sistema</h3>
<p>O software, a marca, o nome e o visual do EquiAltaris pertencem a `+esc(empNome())+`. O contrato concede uma licença de uso não exclusiva e intransferível enquanto durar o plano, e não transfere a propriedade de nada.</p>

<h3>14. Limites de responsabilidade</h3>
<p>O EquiAltaris é uma ferramenta de registro e organização. As informações de saúde e manejo dos cavalos servem de apoio e não substituem a avaliação de médico-veterinário ou de outro profissional habilitado; as decisões clínicas são do profissional responsável. O EquiAltaris não responde pelo conteúdo publicado por usuários, pelas decisões administrativas de cada hípica nem por prejuízo decorrente de informação inserida de forma incorreta. Nos limites permitidos pela lei, a responsabilidade do EquiAltaris fica restrita a danos diretos e ao valor pago pela hípica nos doze meses anteriores ao fato. Nada aqui afasta os direitos que a legislação consumerista assegure ao usuário pessoa física.</p>

<h3>15. Vigência e encerramento</h3>
<p>O contrato vigora por prazo indeterminado. Qualquer das partes pode encerrá-lo mediante aviso com 30 dias de antecedência. O EquiAltaris pode encerrar o acesso imediatamente em caso de violação grave destes Termos.</p>

<h3>16. Mudanças nestes Termos</h3>
<p>Podemos alterar estes Termos. Quando a mudança for relevante, avisamos no próprio sistema e pedimos um novo aceite antes de você continuar usando.</p>

<h3>17. Lei e foro</h3>
<p>Aplica-se a lei brasileira. Fica eleito o foro da comarca de Brasília, Distrito Federal, ressalvado o direito do consumidor de escolher o foro do seu domicílio.</p>
`}};

DOCS.priv={t:'Política de Privacidade',sub:'O que guardamos, por quê e como você controla',html:function(){return `
<h3>1. Quem cuida dos seus dados</h3>
<p>`+idEmp()+` oferece a Plataforma. Os papéis se dividem assim: em relação aos dados operacionais que a hípica cadastra e administra, como alunos, aulas, cavalos e cobranças, a <b>hípica é a controladora</b> e o EquiAltaris atua como <b>operador</b>, tratando os dados apenas conforme a instrução dela e o necessário para o serviço. Em relação à conta de acesso, às publicações da Comunidade e às métricas de uso da plataforma, o <b>EquiAltaris é o controlador</b>.</p>
<p>Dúvidas, pedidos e exercício de direitos: `+esc(empMail())+`.</p>

<h3>2. Que dados tratamos</h3>
<p><b>Cadastro e acesso:</b> nome, e-mail, telefone, data de nascimento do aluno, papel na hípica, senha guardada de forma cifrada e não reversível, data e hora das entradas.</p>
<p><b>Do responsável legal de aluno menor:</b> nome, e-mail e telefone, mais o registro da autorização concedida.</p>
<p><b>Operacionais:</b> aulas, presenças, planos, mensalidades, comprovantes de pagamento enviados, fichas dos cavalos, alimentação, ferrageamento, ocorrências de saúde e resultados de prova.</p>
<p><b>Publicados por você:</b> texto, fotos e resultados que você escolhe publicar na Comunidade, além de curtidas, comentários e republicações.</p>
<p><b>De uso:</b> a contagem de quais telas foram abertas, quando, por qual tipo de usuário e de qual hípica, e um identificador aleatório gerado no seu aparelho para contar visitantes sem identificar quem é.</p>
<p>Não pedimos nem usamos dados sensíveis como origem racial, convicção religiosa, opinião política ou dado biométrico, e não coletamos a sua localização.</p>

<h3>3. Por que tratamos e com que base legal</h3>
<p>Para <b>executar o contrato</b> e entregar o serviço: cadastro, acesso, agenda, financeiro, fichas dos cavalos e comunicação dentro do sistema. Para <b>cumprir obrigação legal</b>: guarda de registros de acesso e de documentos fiscais. Por <b>legítimo interesse</b>: segurança do sistema, prevenção a fraude e abuso, e estatísticas agregadas de uso, que usamos para melhorar a plataforma e para apresentar o alcance do serviço a parceiros comerciais, sempre em números somados e sem identificar pessoas. Por <b>consentimento</b>: a publicação na Comunidade e, no caso de aluno menor, o consentimento específico e destacado do responsável legal.</p>

<h3>4. Sobre as métricas de uso</h3>
<p>Contamos quantas telas foram abertas e quantas pessoas e aparelhos diferentes usaram o sistema em cada período. A contagem de visitantes é feita por um identificador aleatório guardado no seu próprio navegador, que não carrega nome, e-mail nem número de documento, e é contado uma vez por dia. Não rastreamos o caminho que cada pessoa percorre, não montamos perfil de comportamento e não usamos esses dados para publicidade. Os relatórios que apresentamos a parceiros trazem apenas totais.</p>

<h3>5. Com quem compartilhamos</h3>
<p>Não vendemos dados pessoais e não os cedemos para publicidade. Compartilhamos apenas com os fornecedores necessários ao funcionamento: a Supabase, que hospeda o banco de dados em servidores no Brasil, na região de São Paulo; a Resend, que envia os e-mails do sistema, como o de recuperação de senha; e o GitHub Pages, que hospeda as páginas do site. O envio de e-mail implica transferência internacional de nome e endereço de e-mail para os Estados Unidos, feita com as garantias contratuais exigidas pela LGPD. Também podemos compartilhar dados quando a lei ou uma ordem de autoridade competente exigir.</p>
<p>Dentro da Plataforma, cada hípica enxerga apenas os seus próprios dados. O que é publicado na Comunidade, por sua natureza, fica visível para as demais hípicas e usuários do sistema.</p>

<h3>6. Crianças e adolescentes</h3>
<p>O tratamento de dados de aluno menor de idade depende de consentimento específico e destacado do pai, da mãe ou do responsável legal, colhido pela hípica e registrado no sistema. Coletamos o mínimo necessário. O perfil de aluno menor nasce com a configuração mais restritiva disponível, não recebe publicidade direcionada e não é usado para formação de perfil comercial. O responsável pode pedir a qualquer momento o acesso aos dados, a correção, a exclusão ou a revogação da autorização, pelo e-mail `+esc(empMail())+` ou pela própria hípica.</p>

<h3>7. Como protegemos</h3>
<p>Os dados trafegam cifrados. O acesso ao banco é controlado por regras que isolam cada hípica e cada aluno, de modo que um usuário só alcança o que lhe cabe. As senhas são guardadas de forma cifrada e não reversível, e nem o EquiAltaris nem a hípica conseguem lê-las. O acesso administrativo é restrito e registrado. Nenhum sistema é totalmente imune: havendo incidente com risco relevante, comunicamos os titulares e a Autoridade Nacional de Proteção de Dados nos prazos da lei.</p>

<h3>8. Por quanto tempo guardamos</h3>
<p>Dados de cadastro e operacionais ficam enquanto durar a relação com a hípica e, após o encerramento, por 30 dias para exportação, sendo depois excluídos ou anonimizados. Registros de acesso ficam por seis meses, conforme o Marco Civil da Internet. Documentos com reflexo fiscal ficam pelos prazos da legislação tributária. Publicações na Comunidade ficam até que você ou a moderação as removam.</p>

<h3>9. Os seus direitos</h3>
<p>A LGPD garante a você confirmar se tratamos seus dados, acessá-los, corrigi-los, pedir anonimização, bloqueio ou eliminação do que for desnecessário ou excessivo, pedir portabilidade, saber com quem compartilhamos, revogar o consentimento e se opor a tratamento feito por legítimo interesse. Basta escrever para `+esc(empMail())+`. Respondemos em até 15 dias. Quando o pedido envolver dado operacional sob responsabilidade da hípica, encaminhamos a ela e acompanhamos o atendimento.</p>

<h3>10. O que guardamos no seu navegador</h3>
<p>Guardamos no seu navegador apenas o necessário para o serviço funcionar: a sua sessão, para não pedir a senha a cada tela, e o identificador aleatório de aparelho usado na contagem de visitantes. Não usamos cookies de publicidade nem ferramentas de rastreamento de terceiros. Limpar os dados do navegador apaga essas informações.</p>

<h3>11. Mudanças nesta Política</h3>
<p>Podemos atualizar este documento. Mudança relevante é avisada dentro do sistema, com novo aceite quando for o caso. Versão `+DOCV+`, de `+DOCDATA+`.</p>
`}};

DOCS.com={t:'Regras da Comunidade',sub:'O combinado para a área de publicações',html:function(){return `
<h3>O que é a Comunidade</h3>
<p>É o mural do hipismo dentro do EquiAltaris. Hípicas, instrutores e alunos publicam conquistas, divulgam provas, mostram treinos e torcem uns pelos outros. O que você publica aqui aparece para as outras hípicas do sistema — publique pensando que gente de fora da sua cocheira vai ler.</p>

<h3>O que rende boas publicações</h3>
<p>Resultado de prova, com a categoria e a colocação. Evolução de treino. Apresentação do seu cavalo. Convite para competição ou clínica. Parabéns a um colega. Uma boa foto de pista.</p>

<h3>O que não entra</h3>
<p>Ofensa, humilhação, ameaça ou discriminação de qualquer tipo. Nudez e conteúdo sexual. Violência contra pessoa. Imagem de maus-tratos, treinamento abusivo ou animal em sofrimento. Dado pessoal de terceiro, como telefone, endereço, documento ou o valor que alguém paga. Foto de pessoa que não autorizou, e foto de criança ou adolescente sem autorização do responsável. Acusação contra pessoa ou hípica identificável. Venda, propaganda ou captação de clientes sem combinar antes com o EquiAltaris. Aposta, medicamento, suplemento de uso controlado ou qualquer coisa ligada a doping. Conteúdo falso, corrente e spam. E conteúdo que não tem nada a ver com hipismo.</p>

<h3>Foto de criança e adolescente</h3>
<p>Publicar foto de menor exige autorização do responsável legal. Mesmo com autorização, evite informar escola, endereço, rotina ou qualquer dado que permita localizar a criança fora da hípica. Se você é responsável e viu uma foto do seu filho que não autorizou, denuncie: a publicação sai do ar.</p>

<h3>Bem-estar do cavalo</h3>
<p>Publicação que mostre maus-tratos, excesso ou prática proibida pela federação é removida, e os casos graves são comunicados às autoridades. Crítica técnica é bem-vinda; exposição de animal em sofrimento, não.</p>

<h3>Como denunciar</h3>
<p>Use o canal de mensagens do sistema ou escreva para `+esc(empMail())+`, dizendo qual publicação e por quê. Olhamos todas as denúncias. Conteúdo com indício de crime contra criança ou adolescente sai do ar assim que identificado e é comunicado às autoridades.</p>

<h3>O que acontece quando alguém passa do ponto</h3>
<p>Dependendo do caso e da repetição: a publicação é removida; você recebe uma advertência, que aparece ao entrar no sistema; a conta é suspensa; ou a conta é encerrada. Casos graves vão direto para a última medida e, quando for crime, para as autoridades.</p>

<h3>Uma última coisa</h3>
<p>O hipismo brasileiro é pequeno e todo mundo se encontra na pista no fim de semana. Escreva aqui o que você diria olhando no olho.</p>
`}};

DOCS.resp={t:'Autorização do Responsável',sub:'Termo para aluno menor de 18 anos',html:function(){return `
<p class="muted">Este termo é preenchido pela hípica junto ao pai, à mãe ou ao responsável legal do aluno menor de 18 anos, antes da liberação do acesso. A hípica guarda a via assinada e registra a autorização no sistema.</p>

<h3>Declaração</h3>
<p>Eu, responsável legal pelo aluno identificado no cadastro, declaro que fui informado sobre o funcionamento do sistema EquiAltaris, li os Termos de Uso, a Política de Privacidade e as Regras da Comunidade, e <b>autorizo</b>:</p>
<p><b>a)</b> a criação de uma conta de acesso para o aluno, vinculada aos meus dados de contato, para acompanhar aulas, mensalidades e as informações do cavalo;</p>
<p><b>b)</b> o tratamento dos dados pessoais do aluno pela hípica e pelo EquiAltaris, nas finalidades e condições descritas na Política de Privacidade;</p>
<p><b>c)</b> conforme eu marcar no cadastro, a publicação de conteúdo pelo aluno na área Comunidade e o uso da imagem do aluno em fotos de aula, treino e competição publicadas ali.</p>

<h3>Do que estou ciente</h3>

<p>Que, enquanto esta autorização não estiver registrada, a conta do aluno não publica na Comunidade.</p>
<p>Que a hípica é responsável por manter os meus dados de contato atualizados e por me comunicar mudanças relevantes.</p>

<h3>Identificação</h3>
<p>Nome do aluno, data de nascimento, nome do responsável legal, grau de parentesco, e-mail e telefone do responsável, data e assinatura. Esses campos são preenchidos na ficha do aluno dentro do sistema e devem corresponder à via assinada guardada pela hípica.</p>

/* ---------- aceite dos documentos ---------- */
let ACEITES=null,ACEST='',ACETAB='uso',ACEERR='';
const CK=id=>{const e=document.getElementById(id);return !!(e&&e.checked)};
function docsExigidos(){return (UI.user&&UI.user.role==='owner')?[]:['uso','priv','com']}
async function loadAceites(){
  if(!AUTH.perfil||!AUTH.perfil.id){ACEITES=[];ACEST='ok';return}
  try{
    const r=await fetch(SB_URL+'/rest/v1/aceites?select=doc,versao&uid=eq.'+encodeURIComponent(AUTH.perfil.id)+'&versao=eq.'+encodeURIComponent(DOCV),{headers:sbH()});
    if(!r.ok){ACEITES=[];ACEST=r.status===404?'preparando':'erro';return}
    ACEITES=await r.json();ACEST='ok';
  }catch(e){ACEITES=[];ACEST='erro'}
}
function precisaAceite(){
  if(!UI.user||UI.user.role==='owner')return false;
  if(ACEITES===null||ACEST!=='ok')return false;
  const tem={};(ACEITES||[]).forEach(a=>{tem[a.doc]=1});
  return docsExigidos().some(d=>!tem[d]);
}
async function gravarAceite(){
  if(!AUTH.perfil||!AUTH.perfil.id)return false;
  const linhas=docsExigidos().map(d=>({uid:AUTH.perfil.id,doc:d,versao:DOCV,
    papel:AUTH.perfil.papel||'',hipica_id:AUTH.perfil.hipica_id||null}));
  try{
    const h=sbH();h.Prefer='resolution=merge-duplicates';
    const r=await fetch(SB_URL+'/rest/v1/aceites',{method:'POST',headers:h,body:JSON.stringify(linhas)});
    if(!r.ok)return false;
  }catch(e){return false}
  ACEITES=linhas.map(l=>({doc:l.doc,versao:DOCV}));
  return true;
}
function docCorpo(k){
  const d=DOCS[k];if(!d)return '';
  return '<div class="doc"><h2>'+esc(d.t)+'</h2><p class="dsub">'+esc(d.sub)+' · versão '+DOCV+' · '+esc(DOCDATA)+'</p>'+d.html()+'</div>';
}
function docAbas(lista,act){
  return '<div class="tabs" role="tablist">'+lista.map(k=>
    '<button role="tab" aria-selected="'+(ACETAB===k)+'" data-act="'+act+'" data-k="'+k+'">'+esc(DOCS[k].t)+'</button>').join('')+'</div>';
}
function telaAceite(){
  $('#app').hidden=true;$('#modal').innerHTML='';
  const L=$('#login');L.hidden=false;
  const lista=docsExigidos();
  if(lista.indexOf(ACETAB)<0)ACETAB=lista[0];
  L.innerHTML='<div class="acew"><div class="acec">'+
    '<div class="lgl" style="margin-bottom:14px"><img src="'+LOGO+'" alt="EquiAltaris"></div>'+
    '<h3 style="margin:0 0 4px">Antes de continuar</h3>'+
    '<p class="muted sm" style="margin:0 0 14px">Leia e aceite os documentos abaixo. Guardamos a data e a versão do que você aceitou.</p>'+
    docAbas(lista,'acetab')+
    '<div class="acebox">'+docCorpo(ACETAB)+'</div>'+
    '<label class="chk" style="margin-top:14px"><input type="checkbox" id="ace-ok"><span>Li e aceito os Termos de Uso, a Política de Privacidade e as Regras da Comunidade.</span></label>'+
    (ACEERR?'<div class="err" style="display:block">'+esc(ACEERR)+'</div>':'')+
    '<div class="row" style="margin-top:12px"><button class="btn" data-act="acesair">Sair</button>'+
    '<button class="btn pri" data-act="aceok" style="margin-left:auto">Aceitar e entrar</button></div>'+
    '</div></div>';
}
function docsHTML(){
  const lista=['uso','priv','com','resp'];
  if(lista.indexOf(ACETAB)<0)ACETAB='uso';
  const quando=(ACEITES||[]).length?'<span class="muted sm">Você aceitou a versão '+DOCV+'.</span>':'';
  return '<div class="row" style="align-items:center;gap:10px;margin:14px 0" id="relact">'+
    '<label class="f" style="margin:0;max-width:280px">Documento<select id="doc-sel">'+
      lista.map(k=>'<option value="'+k+'"'+(ACETAB===k?' selected':'')+'>'+esc(DOCS[k].t)+'</option>').join('')+
    '</select></label>'+quando+
    '<button class="btn" data-act="relprint" style="margin-left:auto">Imprimir ou salvar em PDF</button></div>'+
    '<div class="card" id="rel">'+docCorpo(ACETAB)+'</div>';
}
/* ---------- alunos menores de idade ---------- */
function idadeAluno(st){
  const n=st&&st.nasc;if(!n||!/^\d{4}-\d{2}-\d{2}$/.test(n))return null;
  const d=new Date(n+'T12:00:00'),h=new Date();
  if(isNaN(d.getTime()))return null;
  let i=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth();
  if(m<0||(m===0&&h.getDate()<d.getDate()))i--;
  return (i>=0&&i<120)?i:null;
}
function ehMenor(st){const i=idadeAluno(st);return i!==null&&i<18}
function autorizado(st){return !!(st&&st.aut&&st.aut.em)}
function podeComunidade(st){return !ehMenor(st)||!!(st&&st.aut&&st.aut.em&&st.aut.com)}
function pendentesAut(){return (S&&S.students||[]).filter(st=>ehMenor(st)&&!autorizado(st))}
function pillAut(st){
  if(!ehMenor(st))return '';
  if(!autorizado(st))return '<span class="pill bad">autorização pendente</span>';
  return '<span class="pill '+(st.aut.com?"ok":"warn")+'">menor · '+(st.aut.com?'pode publicar':'sem Comunidade')+'</span>';
}
function blocoMenor(o){
  if(!ehMenor(o))return '';
  const rs=o.resp||{},au=o.aut||{},i=idadeAluno(o);
  return '<div class="note" style="margin:10px 0"><b>Aluno menor de idade'+(i!==null?' · '+i+' anos':'')+'.</b> '+
    'A conta só é liberada com a autorização do pai, da mãe ou do responsável legal. '+
    (i!==null&&i<16?'Abaixo de 16 anos, a conta fica vinculada ao responsável indicado aqui.':'')+'</div>'+
    '<div class="fg">'+fld('Nome do responsável legal','s-rn',rs.nome||'','text',null,'full')+
    fld('E-mail do responsável','s-re',rs.email||'','email')+
    fld('Telefone do responsável','s-rt',rs.tel||'','text')+
    fld('Parentesco','s-rp',rs.par||'','select',[['Mãe','Mãe'],['Pai','Pai'],['Responsável legal','Responsável legal']])+'</div>'+
    '<label class="chk"><input type="checkbox" id="s-ra"'+(au.em?' checked':'')+'><span>Recebi e arquivei a autorização assinada pelo responsável.'+(au.em?' Registrada em '+fmtD(au.em)+'.':'')+'</span></label>'+
    '<label class="chk"><input type="checkbox" id="s-rc"'+(au.com?' checked':'')+'><span>O responsável autoriza o aluno a publicar na Comunidade e o uso da imagem dele nas publicações.</span></label>'+
    '<p class="muted sm">O texto da autorização está em Termos e privacidade, na aba Autorização do Responsável.</p>';
}
function motivoPostar(){
  if(!UI.user)return 'Entre para publicar.';
  if(UI.user.role!=='aluno')return '';
  const st=R(UI.user.id);
  if(!st)return '';
  if(ehMenor(st)&&!autorizado(st))return 'A sua conta é de aluno menor de idade e ainda não tem a autorização do responsável registrada. Fale com a hípica para liberar a publicação.';
  if(ehMenor(st)&&!st.aut.com)return 'O seu responsável autorizou o acesso ao sistema, mas não a publicação na Comunidade. Você pode ler tudo por aqui.';
  return '';
}

/* ---------- visitantes e relatorio mensal ---------- */
let MENSAL=null,MENSALST='';
function meuDispositivo(){
  try{
    let d=localStorage.getItem('equialtaris.disp');
    if(!d||d.length<8){d='d'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
      localStorage.setItem('equialtaris.disp',d)}
    return d;
  }catch(e){return ''}
}
async function registrarVisita(){
  const d=meuDispositivo();
  if(!d)return;
  try{sessionStorage.getItem('equi.vis')}catch(e){}
  try{if(sessionStorage.getItem('equi.vis'))return;sessionStorage.setItem('equi.vis','1')}catch(e){}
  try{await fetch(SB_URL+'/rest/v1/rpc/registrar_visita',{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_disp:d})})}catch(e){}
}
async function loadMensal(){
  MENSALST='carregando';
  try{
    const r=await fetch(SB_URL+'/rest/v1/rpc/uso_mensal',{method:'POST',headers:sbH(),body:JSON.stringify({p_meses:12})});
    if(!r.ok){MENSALST=r.status===404?'preparando':'erro';return}
    MENSAL=await r.json();MENSALST='ok';
  }catch(e){MENSALST='erro'}
}
function mesNome(ym){
  const M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const p=String(ym||'').split('-');
  return p.length===2?(M[(+p[1])-1]||'?')+' de '+p[0]:(ym||'');
}
function baseHoje(){
  let al=0,cv=0;
  if(CONTAG)Object.keys(CONTAG).forEach(k=>{if(!(G.hips||[]).some(h=>h.id===k))return;al+=+CONTAG[k].alunos||0;cv+=+CONTAG[k].cavalos||0});
  else Object.keys(G.tenants||{}).forEach(k=>{const T=G.tenants[k];if(!T)return;
    al+=(T.students||[]).length;cv+=(T.horses||[]).length});
  return {hipicas:(G.hips||[]).length,alunos:al,cavalos:cv};
}
function relatorioHTML(){
  if(MENSALST==='carregando')return empty('Carregando o relatório…');
  if(MENSALST==='preparando')return empty('O relatório ainda não foi liberado no servidor.');
  if(MENSALST==='erro')return empty('Não consegui carregar o relatório agora.');
  const l=MENSAL||[];
  if(!l.length)return empty('Sem dados ainda.');
  const b=baseHoje();
  const soma=c=>l.reduce((t,x)=>t+(+x[c]||0),0);
  const ult=l[l.length-1]||{},pen=l[l.length-2]||null;
  const varia=(c)=>{
    if(!pen||!(+pen[c]))return '';
    const d=Math.round(((+ult[c]||0)-(+pen[c]))/(+pen[c])*100);
    return '<small style="color:'+(d>=0?'var(--ok)':'var(--bad)')+'">'+(d>=0?'+':'')+d+'% vs. mês anterior</small>';
  };
  return '<div id="rel">'+
    '<div class="relcab"><div><b>EquiAltaris</b><span>Relatório de uso da plataforma</span></div>'+
      '<span class="muted sm">Gerado em '+fmtD(TODAY)+'</span></div>'+
    '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="card kpi"><span>Visitantes no mês</span><b>'+(+ult.visitantes||0)+'</b>'+varia('visitantes')+'</div>'+
      '<div class="card kpi"><span>Pessoas usando</span><b>'+(+ult.pessoas||0)+'</b>'+varia('pessoas')+'</div>'+
      '<div class="card kpi"><span>Telas abertas</span><b>'+(+ult.acessos||0)+'</b>'+varia('acessos')+'</div>'+
      '<div class="card kpi"><span>Publicações</span><b>'+(+ult.publicacoes||0)+'</b>'+varia('publicacoes')+'</div>'+
    '</div>'+
    '<div class="grid g4" style="margin-bottom:18px">'+
      '<div class="card kpi"><span>Hípicas na base</span><b>'+b.hipicas+'</b><small>hoje</small></div>'+

function dvBars(months){
  const W=560,Hh=250,L=56,B=30,T=14,R=8,pw=W-L-R,ph=Hh-B-T;
  const mx=Math.max(1,...months.map(m=>m.pago+m.conf+m.aberto));
  const step=Math.pow(10,Math.floor(Math.log10(mx))),nice=Math.ceil(mx/step*1.0)*step;
  const top=nice,ticks=[0,.25,.5,.75,1].map(f=>top*f);
  const y=v=>T+ph-(v/top)*ph,bw=Math.min(54,pw/months.length*.5),band=pw/months.length;
  let g='';
  ticks.forEach(t=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"'+(t?' stroke-dasharray="3 3"':'')+'/><text x="'+(L-8)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(t>=1000?(t/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':t)+'</text>'});
  const segs=[['pago','Paga','var(--s1)'],['conf','A conferir','var(--s3)'],['aberto','Em aberto','var(--s2)']];
  months.forEach((m,i)=>{
    const x=L+band*i+(band-bw)/2;let acc=0;
    segs.forEach(sg=>{const v=m[sg[0]];if(!v)return;const y1=y(acc+v),y0=y(acc);
      g+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(2,y0-y1)+'" rx="4" fill="'+sg[2]+'" stroke="var(--surface)" stroke-width="2" data-tip="'+esc(monthLabel(m.ref)+' · '+sg[1]+': '+brl(v))+'"/>';acc+=v});
    g+='<text x="'+(x+bw/2)+'" y="'+(Hh-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+MES[+m.ref.slice(5)-1].slice(0,3)+'</text>';
    if(m.pago+m.conf+m.aberto)g+='<text x="'+(x+bw/2)+'" y="'+(y(acc)-6)+'" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">'+brl(acc).replace(',00','')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="Cobranças por mês, divididas em pagas, a conferir e em aberto">'+g+'</svg>';
}
function dvDonut(parts){
  const tot=parts.reduce((t,p)=>t+p.n,0),r=62,C=2*Math.PI*r;let off=0,g='';
  if(!tot)return '';
  parts.forEach(p=>{if(!p.n)return;const len=p.n/tot*C,gap=parts.filter(x=>x.n).length>1?3:0;
    g+='<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="22" stroke-dasharray="'+Math.max(0,len-gap)+' '+(C-len+gap)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 90 90)" data-tip="'+esc(p.l+': '+p.n+' hípica(s)')+'"/>';off+=len});
  return '<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Situação das hípicas">'+g+'<text x="90" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor">'+tot+'</text><text x="90" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">hípicas</text></svg>';

function pdfW(s,sz,b){let w=0;for(const ch of String(s)){const c=ch.normalize('NFD')[0].charCodeAt(0);w+=(c>=32&&c<=126?HW[c-32]:556)}return w*sz/1000*(b?1.07:1)}
function pdfEsc(s){let o='';s=String(s).normalize('NFC');for(const ch of s){let c=ch.charCodeAt(0);if(c===0x2014)c=0x97;else if(c===0x2013)c=0x96;else if(c===0x2022)c=0x95;else if(c===0x2026)c=0x85;else if(c>255)c=63;

const NAVY=[.08,.11,.16],BRASS=[.83,.63,.23],GREY=[.35,.38,.43],LINE=[.85,.87,.9],ZEBRA=[.965,.972,.98],RED=[.72,.2,.16],GREEN=[.09,.51,.35],AMBER=[.66,.42,0];
function PDF(hip,title){
  const PW=595,PH=842,M=40,CW=PW-2*M;const pages=[];let ops,y;
  const col=c=>c.join(' ');
  function text(x,yy,s,sz,b,c,al){if(al==='r')x-=pdfW(s,sz,b);ops.push('BT /F'+(b?2:1)+' '+sz+' Tf '+col(c||[0,0,0])+' rg '+x.toFixed(1)+' '+(PH-yy).toFixed(1)+' Td ('+pdfEsc(s)+') Tj ET')}
  function rect(x,yy,w,h,c){ops.push(col(c)+' rg '+x.toFixed(1)+' '+(PH-yy-h).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1)+' re f')}
  function hline(yy,c,w){ops.push((w||.6)+' w '+col(c||LINE)+' RG '+M+' '+(PH-yy).toFixed(1)+' m '+(PW-M)+' '+(PH-yy).toFixed(1)+' l S')}
  function page(){ops=[];pages.push(ops);rect(0,0,PW,50,NAVY);rect(0,50,PW,3,BRASS);text(M,31,hip,14,1,[1,1,1]);text(PW-M,31,title,10.5,0,[.85,.88,.93],'r');y=78}

  const api={
    h1(t,sub){ensure(40);text(M,y+6,t,18,1,NAVY);y+=24;if(sub){text(M,y+2,sub,9.5,0,GREY);y+=16}y+=4},
    h2(t){ensure(84);y+=8;text(M,y+10,t,12,1,NAVY);y+=15;hline(y,BRASS,1.2);y+=10},
    p(t,sz,c,b){sz=sz||10;wrap(t,CW,sz,b).forEach(l=>{ensure(sz+5);text(M,y+sz,l,sz,b,c||[.15,.17,.2]);y+=sz+4});y+=2},
    gap(n){y+=n||8},
    pageBreak(){page()},
    kpis(list){const n=list.length,gw=8,w=(CW-gw*(n-1))/n;ensure(58);list.forEach((k,i)=>{const x=M+i*(w+gw);rect(x,y,w,48,ZEBRA);rect(x,y,3,48,k[2]||BRASS);text(x+11,y+16,k[0],8,0,GREY);text(x+11,y+37,k[1],14,1,NAVY)});y+=60},
    table(cols,rows,empty){

      const head=()=>{ensure(24);rect(M,y,CW,20,[.9,.92,.95]);let x=M;cols.forEach(c=>{text(c.a==='r'?x+c.w-6:x+6,y+13.5,c.t,8,1,NAVY,c.a);x+=c.w});y+=20};
      head();if(!rows.length){ensure(26);text(M+6,y+16,empty||'Nada a mostrar.',9,0,GREY);y+=26;hline(y);return}
      rows.forEach((r,ri)=>{
        const cells=r.map((cell,i)=>{const o=(cell&&typeof cell==='object')?cell:{t:cell};return {o,l:wrap(o.t,cols[i].w-12,9,o.b)}});
        const h=Math.max(...cells.map(c=>c.l.length))*12+8;
        if(y+h>PH-50){page();head()}
        if(ri%2)rect(M,y,CW,h,ZEBRA);let x=M;
        cells.forEach((c,i)=>{c.l.forEach((ln,li)=>text(cols[i].a==='r'?x+cols[i].w-6:x+6,y+13+li*12,ln,9,c.o.b,c.o.c||[.15,.17,.2],cols[i].a));x+=cols[i].w});
        y+=h;
      });

    finish(){

      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids=[];pages.forEach(ps=>{const st=ps.join('\n');const c=add('<< /Length '+st.length+' >>\nstream\n'+st+'\nendstream');const pg=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+c+' 0 R >>');kids.push(pg+' 0 R')});

      const xr=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>('0000000000'+o).slice(-10)+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xr+'\n%%EOF';
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}
  };

async function savePDF(doc,filename){

  try{const dl=window.claude&&await window.claude.use('downloads');if(dl){await dl.save({filename:filename,data:blob});return}}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}

}

function readSlot(f){return new Promise((res,rej)=>{
  if(!/^image\//.test(f.type))return rej('Formato não aceito. Envie JPG ou PNG.');
  if(f.size>8*1024*1024)return rej('Arquivo muito pesado. O limite é 8 MB.');
  const fr=new FileReader();fr.onerror=()=>rej('Falha ao ler o arquivo.');
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Não consegui ler essa imagem.');im.onload=()=>{
    if(im.width<400)return rej('Imagem pequena ('+im.width+' px de largura). Envie uma com pelo menos 400 px.');
    const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');
    x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(1,1,1,1).data;const bg=d[3]<200?'#0f1424':'rgb('+d[0]+','+d[1]+','+d[2]+')';
    if(d[3]<200){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height)}
    res({d:c.toDataURL('image/jpeg',.82),bg:bg,r:c.width/c.height})};im.src=fr.result};fr.readAsDataURL(f)})}

    if(!r.ok){EVST=r.status===404?'preparando':'erro';return}

    EVPUB=(l||[]).map(x=>Object.assign({},x.data||{},{id:x.id,hipica_id:x.hipica_id,hipica_nome:x.hipica_nome}));

async function pubEvento(e){
  const hip=HIP();if(!hip)return false;
  const row={id:e.id,hipica_id:hip.id,hipica_nome:hip.fantasia,
    data:{nome:e.nome,date:e.date,local:e.local,cats:e.cats,prazo:e.prazo,taxa:e.taxa,
          status:e.status,foto:e.foto||'',contato:e.contato||'',logo:hip.logo||''}};
  try{
    const h=sbH();h.Prefer='resolution=merge-duplicates';
    const r=await fetch(SB_URL+'/rest/v1/eventos',{method:'POST',headers:h,body:JSON.stringify([row])});
    return r.ok;
  }catch(x){return false}
}
async function despubEvento(id){
  try{
    const r=await fetch(SB_URL+'/rest/v1/eventos?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbH()});

  }catch(x){return false}
}

const XLEP=Date.UTC(1899,11,30);
const nh=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,' ').trim().toLowerCase();
const escX=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colLetra=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s};
function serialData(n){return new Date(XLEP+Math.floor(n)*864e5).toISOString().slice(0,10)}
function serialHora(n){let mi=Math.round((n-Math.floor(n))*1440);if(mi>=1440)mi=1439;return String(Math.floor(mi/60)).padStart(2,'0')+':'+String(mi%60).padStart(2,'0')}
const numCel=v=>{const s=String(v==null?'':v).replace(/[^\d,.\-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return +s||0};
const simNao=v=>/^(s|sim|x|1|true|verdadeiro|y|yes)$/i.test(String(v==null?'':v).trim());
function dataCel(v){
  const s=String(v==null?'':v).trim();if(!s)return '';
  if(/^\d{4}-\d{1,2}-\d{1,2}/.test(s)){const p=s.slice(0,10).split('-');return p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0')}
  if(/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(s)){const p=s.split(/[\/.\-]/);let a=p[2];if(a.length===2)a='20'+a;return a+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')}
  if(/^\d{3,6}(\.\d+)?$/.test(s))return serialData(+s);
  return '';
}
function horaCel(v){
  const s=String(v==null?'':v).trim();if(!s)return '';
  if(/^\d*\.\d+$/.test(s))return serialHora(+s);
  const m=/^(\d{1,2})[:h.](\d{2})/.exec(s);if(m&&+m[1]<24&&+m[2]<60)return String(+m[1]).padStart(2,'0')+':'+m[2];
  if(/^\d{3,4}$/.test(s)){const t=s.padStart(4,'0');return t.slice(0,2)+':'+t.slice(2)}
  return '';
}
function diaCel(v){
  const s=nh(v);if(!s)return -1;
  if(/^[1-7]$/.test(s))return +s-1;

/* --- leitor de zip/xlsx sem biblioteca --- */
function zipAbrir(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let i=u8.length-22;while(i>=0&&dv.getUint32(i,true)!==0x06054b50)i--;
  if(i<0)throw new Error('zip');
  const n=dv.getUint16(i+10,true);let off=dv.getUint32(i+16,true);const ent={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const met=dv.getUint16(off+10,true),cs=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    const lo=dv.getUint32(off+42,true);
    const nome=new TextDecoder().decode(u8.subarray(off+46,off+46+nl));
    ent[nome]={met:met,ini:lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),cs:cs};
    off+=46+nl+el+cl;
  }
  return {u8:u8,ent:ent};
}
async function zipTexto(z,nome){
  const e=z.ent[nome];if(!e)return '';
  const raw=z.u8.subarray(e.ini,e.ini+e.cs);
  if(e.met===0)return new TextDecoder().decode(raw);
  if(typeof DecompressionStream==='undefined')throw new Error('nodeflate');
  return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}

const colNum=r=>{const m=/^([A-Z]+)/.exec(String(r||''));if(!m)return 0;let n=0;for(let i=0;i<m[1].length;i++)n=n*26+(m[1].charCodeAt(i)-64);return n-1};
function linhasSheet(doc,sst){
  const out=[];
  [].forEach.call(doc.getElementsByTagName('row'),row=>{
    const arr=[];
    [].forEach.call(row.getElementsByTagName('c'),c=>{
      const ci=colNum(c.getAttribute('r')),t=c.getAttribute('t')||'n';let v='';
      if(t==='s'){const n=c.getElementsByTagName('v')[0];v=n?(sst[+n.textContent]||''):''}
      else if(t==='inlineStr'){let s='';[].forEach.call(c.getElementsByTagName('t'),x=>{s+=x.textContent});v=s}
      else{const n=c.getElementsByTagName('v')[0];v=n?n.textContent:''}
      arr[ci]=v;
    });
    out.push(arr);
  });
  return out;
}

    let alvo=map[rid]||('worksheets/sheet'+(i+1)+'.xml');
    alvo=String(alvo).replace(/^\/?xl\//,'').replace(/^\//,'');
    const txt=await zipTexto(z,'xl/'+alvo);if(!txt)continue;
    abas.push({nome:ss[i].getAttribute('name')||('Aba '+(i+1)),linhas:linhasSheet(XP(txt),sst)});
  }

function lerCSV(txt){
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  const l1=txt.split('\n')[0]||'',sep=(l1.split(';').length>l1.split(',').length)?';':',';
  const out=[];let row=[],cel='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cel+='"';i++}else q=false}else cel+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cel);cel=''}
    else if(ch==='\n'){row.push(cel);cel='';out.push(row);row=[]}
    else if(ch!=='\r')cel+=ch;
  }
  row.push(cel);if(row.some(x=>String(x).trim()!==''))out.push(row);
  return out;
}

function mapear(hdr,defs){
  const H=hdr.map(nh),idx={};
  Object.keys(defs).forEach(k=>{
    let i=-1;
    for(let a=0;a<defs[k].length&&i<0;a++)i=H.indexOf(defs[k][a]);
    if(i<0)for(let j=0;j<H.length&&i<0;j++)if(H[j]&&defs[k].some(a=>H[j].indexOf(a)===0))i=j;
    idx[k]=i;
  });
  return idx;
}
function tipoAba(hdr){
  const H=' '+hdr.map(nh).join(' | ')+' ';
  const tem=a=>a.some(x=>H.indexOf(' '+x)>=0);
  if(tem(['proprietario','raca','altura que salta','baia','piquete','nome do cavalo']))return 'cavalos';
  if(tem(['e mail','email','mensalidade','dia da aula fixa','altura de trabalho','nome do aluno']))return 'alunos';
  return '';
}

function analisarAbas(abas){
  const res={alunos:[],cavalos:[]};
  (abas||[]).forEach(ab=>{
    const linhas=(ab.linhas||[]).filter(r=>r&&r.some(c=>String(c==null?'':c).trim()!==''));
    if(linhas.length<2)return;
    let hi=-1,tipo='';
    for(let i=0;i<Math.min(linhas.length,10)&&hi<0;i++){const t=tipoAba(linhas[i]);if(t){hi=i;tipo=t}}
    if(hi<0)return;
    const idx=mapear(linhas[hi],tipo==='alunos'?COL_AL:COL_CV);
    for(let i=hi+1;i<linhas.length;i++){
      const lin=linhas[i];
      const g=k=>idx[k]>=0?String(lin[idx[k]]==null?'':lin[idx[k]]).trim():'';
      const r=(tipo==='alunos')?linhaAluno(g):linhaCavalo(g);
      if(r)res[tipo].push(r);
    }
  });
  return res;
}

function crc32(u8){
  let t=crc32.t;
  if(!t){t=crc32.t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c}}
  let r=-1;for(let i=0;i<u8.length;i++)r=(r>>>8)^t[(r^u8[i])&255];
  return (r^-1)>>>0;
}
function zipGerar(arqs){
  const enc=new TextEncoder(),partes=[],cen=[];let off=0;
  arqs.forEach(f=>{
    const n=enc.encode(f.n),d=enc.encode(f.d),cr=crc32(d);
    const lh=new Uint8Array(30+n.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(12,0x21,true);
    v.setUint32(14,cr,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,n.length,true);
    lh.set(n,30);partes.push(lh,d);
    const ch=new Uint8Array(46+n.length),w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(14,0x21,true);
    w.setUint32(16,cr,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);
    w.setUint16(28,n.length,true);w.setUint32(42,off,true);
    ch.set(n,46);cen.push(ch);off+=lh.length+d.length;
  });
  let cs=0;cen.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22),e=new DataView(eo.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,arqs.length,true);e.setUint16(10,arqs.length,true);
  e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(partes.concat(cen,[eo]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function tamFile(f){return (f&&f.data)?Math.round(String(f.data).length*0.75):0}
const kbTxt=n=>n<1048576?(Math.max(1,Math.round(n/1024))+' KB'):((n/1048576).toFixed(1).replace('.',',')+' MB');
let ARQINFO={};
async function arqInfoCarregar(){
  ARQINFO={};
  const ids=(S.pag||[]).filter(p=>p.fileId&&!p.arq).map(p=>p.fileId);
  if(!SYNC.ready){ids.forEach(i=>{if(S.files[i])ARQINFO[i]=tamFile(S.files[i])});return}
  for(let k=0;k<ids.length;k+=500){try{Object.assign(ARQINFO,await rpcJ('arquivos_info',{ids:ids.slice(k,k+500)}))}catch(e){}}
}
const pesoArq=id=>ARQINFO[id]!==undefined?+ARQINFO[id]:(S.files[id]?tamFile(S.files[id]):null);
function mesesArquivaveis(){
  const cm=TODAY.slice(0,7),m={};
  (S.pag||[]).forEach(p=>{
    if(!p.ref||p.ref>=cm||p.arq)return;
    const g=m[p.ref]||(m[p.ref]={ref:p.ref,qtd:0,comp:0,bytes:0,valor:0});
    g.qtd++;g.valor+=+p.valor||0;
    const b=p.fileId?pesoArq(p.fileId):null;
    if(b!==null){g.comp++;g.bytes+=b}
  });
  return Object.keys(m).sort().map(k=>m[k]);
}
function pesoComprovantes(){
  let n=0,b=0;
  (S.pag||[]).forEach(p=>{if(!p.fileId||p.arq)return;const x=pesoArq(p.fileId);if(x!==null){n++;b+=x}});
  return {n:n,b:b};
}
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function xmlMes(ref){
  const h=HIP(),al=id=>(S.students.find(x=>x.id===id)||{name:'',email:''});
  const lista=(S.pag||[]).filter(p=>p.ref===ref&&!p.arq);
  const tot=lista.reduce((x,p)=>x+(+p.valor||0),0);
  const rec=lista.filter(p=>p.status==='confirmado').reduce((x,p)=>x+(+p.valor||0),0);
  const L=['<?xml version="1.0" encoding="UTF-8"?>',
   '<!-- EquiAltaris - arquivo de pagamentos.',
   '     Cada <comprovante> traz a imagem em base64. Para recuperar a imagem, decodifique',
   '     o conteudo e salve com a extensao do atributo tipo (por exemplo image/jpeg = .jpg). -->',
   '<arquivoPagamentos versao="1">',
   '  <hipica id="'+xmlEsc(h&&h.id)+'" nome="'+xmlEsc(h&&h.fantasia)+'" cnpj="'+xmlEsc((h&&h.cnpj)||'')+'"/>',
   '  <competencia>'+xmlEsc(ref)+'</competencia>',
   '  <geradoEm>'+new Date().toISOString()+'</geradoEm>',
   '  <resumo quantidade="'+lista.length+'" total="'+tot.toFixed(2)+'" recebido="'+rec.toFixed(2)+'"/>',
   '  <pagamentos>'];
  lista.forEach(p=>{
    const a=al(p.student),f=p.fileId&&S.files[p.fileId];
    L.push('    <pagamento id="'+xmlEsc(p.id)+'">');
    L.push('      <aluno id="'+xmlEsc(p.student)+'" nome="'+xmlEsc(a.name)+'" email="'+xmlEsc(a.email||'')+'"/>');
    L.push('      <descricao>'+xmlEsc(p.desc||'')+'</descricao>');
    L.push('      <vencimento>'+xmlEsc(p.venc||'')+'</vencimento>');
    L.push('      <valor>'+(+p.valor||0).toFixed(2)+'</valor>');
    L.push('      <situacao>'+xmlEsc(p.status||'')+'</situacao>');
    if(p.paidAt)L.push('      <pagoEm>'+xmlEsc(p.paidAt)+'</pagoEm>');
    if(p.motivo)L.push('      <motivo>'+xmlEsc(p.motivo)+'</motivo>');
    if(f){
      const m=/^data:([^;]+);base64,([\s\S]*)$/.exec(String(f.data||''));
      if(m)L.push('      <comprovante nome="'+xmlEsc(f.name||'')+'" tipo="'+xmlEsc(m[1])+'" enviadoEm="'+xmlEsc(f.at||'')+'" codificacao="base64">'+m[2]+'</comprovante>');
      else L.push('      <comprovante nome="'+xmlEsc(f.name||'')+'" tipo="url" enviadoEm="'+xmlEsc(f.at||'')+'" codificacao="texto">'+xmlEsc(f.data||'')+'</comprovante>');
    }else L.push('      <comprovante ausente="sim"/>');
    L.push('    </pagamento>');
  });
  L.push('  </pagamentos>','</arquivoPagamentos>');
  return L.join('\n');
}

function listModal(title,list,fields,row){
  const body=()=>'<ul class="hz-list">'+(list.length?list.map(x=>'<li><span>'+row(x)+'</span><button class="btn sm danger" data-ldel="'+x.id+'">Remover</button></li>').join(''):'<li class="muted">Nada registrado ainda.</li>')+'</ul><h4 style="margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">Adicionar</h4><div class="fg">'+fields.map(f=>fld(f[0],'lf-'+f[1],f[4]||'',f[2]||'text',f[3],f[5])).join('')+'</div><div class="err" id="l-err" role="alert"></div><div class="row" style="margin-top:8px"><button class="btn brass" id="l-add">Adicionar</button></div>';
  modal({title:title,wide:true,body:body(),noFocus:true,after:()=>{
    const root=$('#modal');let pf=null;
    const wire=()=>{
      const fi=document.getElementById('lf-file');if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;readImage(f).then(d=>{pf={name:f.name,data:d};$('#l-err').textContent=''}).catch(m=>{pf=null;$('#l-err').textContent=m})};
      $('#l-add').onclick=()=>{const o={id:uid()};fields.forEach(f=>{if(f[2]==='file'){if(pf)o.file=addFile(pf.name,pf.data)}else o[f[1]]=V('lf-'+f[1])});if(!o[fields[0][1]]){$('#l-err').textContent='Preencha o primeiro campo.';return}list.push(o);save();pf=null;refresh()};
      root.querySelectorAll('[data-ldel]').forEach(x=>x.onclick=()=>{const i=list.findIndex(y=>y.id===x.dataset.ldel);if(i>=0)list.splice(i,1);save();refresh()});
    };
    const refresh=()=>{root.querySelector('.md>div').innerHTML=body();wire()};
    wire();$('#m-x').addEventListener('click',()=>render());
  }});
}

function idadeDe(h){const a=+(h&&h.nasc);if(!a||a<1950)return null;const i=new Date().getFullYear()-a;return (i>=0&&i<60)?i:null}

  return '<div class="tw"><table class="mens"><thead><tr><th>Mensalidade do cavalo</th><th class="n">R$ por mês</th></tr></thead><tbody>'+
    ITENS_FIXOS.map(x=>lin(x[0],x[1])).join('')+
    '<tr class="secrow"><td colspan="2"><b>Opcionais</b> · deixe zerado o que não for cobrado</td></tr>'+
    ITENS_OPC.map(x=>lin(x[0],x[1])).join('')+

    '</tbody></table></div>'+

}

  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tp.textContent=t.getAttribute('data-tip');tp.style.display='block'}else tp.style.display='none'});
  document.addEventListener('mousemove',e=>{if(tp.style.display==='block'){tp.style.left=Math.min(innerWidth-270,e.clientX+12)+'px';tp.style.top=(e.clientY+14)+'px'}});})();
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hq'){UI.hq=t.value;const p=t.selectionStart;render();const n=$('#hq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pix-k'){S.pix=t.value.trim();save();return}
  if(t.id==='fd-f'){const f=t.files[0];if(!f)return;
    const n=$('#fd-n'),er=$('#fd-err');
    if(!/^image\//.test(f.type)){if(er)er.textContent='Envie uma imagem (PNG ou JPG).';return}
    if(f.size>4*1024*1024){if(er)er.textContent='Foto muito pesada. O limite é 4 MB.';return}
    if(n)n.textContent='carregando…';
    readImage(f).then(d=>{FEEDFOTO=d;if(n)n.textContent='foto escolhida';if(er)er.textContent=''})
      .catch(()=>{if(er)er.textContent='Não consegui ler a foto.'});
    return}
  if(t.id==='hl-f'){const f=t.files[0];if(!f)return;if(!/^image\//.test(f.type)){$('#hl-err').textContent='Formato não aceito. Envie PNG, JPG ou SVG.';return}
    if(f.size>5*1024*1024){$('#hl-err').textContent='Arquivo muito pesado ('+(f.size/1048576).toFixed(1).replace('.',',')+' MB). O limite é 5 MB.';return}
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{if(im.width&&im.width<300&&!/svg/.test(f.type)){$('#hl-err').textContent='Imagem pequena ('+im.width+' px de largura). Envie uma com pelo menos 300 px para não ficar borrada.';return}const k=Math.min(1,420/Math.max(im.width||420,im.height||420)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.width||420)*k));c.height=Math.max(1,Math.round((im.height||420)*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);HIP().logo=c.toDataURL('image/png');UI.logoState='done';save();render()};im.onerror=()=>{$('#hl-err').textContent='Não consegui ler essa imagem.'};im.src=fr.result};fr.readAsDataURL(f);return}
  if(t.id==='pc-multi'){const fs=[].slice.call(t.files);if(!fs.length)return;const errs=[];G.parc=G.parc||[];
    (async()=>{for(const f of fs){if(G.parc.length>=12){errs.push('Limite de 12 parceiros atingido.');break}
      try{const d=await readPhoto(f,1600);G.parc.push({id:uid(),nome:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,40)||'Parceiro',link:'',ativa:true,img:d})}catch(m){errs.push(f.name+': '+m)}}
      save();render();if(errs.length){const e=$('#pc-merr');if(e)e.textContent=errs.join(' · ')}})();return}
  if(t.id==='pc-b'||t.id==='pc-c'){const f=t.files[0];if(!f)return;const al=t.id==='pc-b';readSlot(f).then(r=>{if(al){PCB=r.d;PBA=r.bg;PRA=r.r}else{PCC=r.d;PBC=r.bg;PRC=r.r}$(al?'#pc-bprev':'#pc-cprev').innerHTML='<img src="'+r.d+'" alt="Pré-visualização">';$('#pc-err').textContent=''}).catch(m=>{$('#pc-err').textContent=m});return}
  if(t.id==='pcsz-a'||t.id==='pcsz-c'){G.pcfg=G.pcfg||{};G.pcfg[t.id==='pcsz-a'?'aluno':'cavalo']=t.value;save();render();return}
  if(t.id==='pc-f'){const f=t.files[0];if(!f)return;readPhoto(f,1600).then(d=>{PCF=d;$('#pc-prev').innerHTML='<img src="'+d+'" alt="Pré-visualização">';$('#pc-err').textContent=''}).catch(m=>{$('#pc-err').textContent=m});return}
  if(t.id==='ow-tel'){G.owner.tel=telFmt(t.value.trim());save();return}
  if(t.id==='cfg-lang'){setLang(t.value);render();return}
  if(t.id==='cfg-moeda'){const h=HIP();if(h){h.moeda=t.value;save();render()}return}
  if(t.id==='doc-sel'){ACETAB=t.value;render();return}
  if(t.id==='ow-pix'){G.owner.pix=t.value.trim();save();return}
  if(t.id==='ow-rz'){G.owner.razao=t.value.trim();save();return}
  if(t.id==='ow-cn'){G.owner.cnpj=t.value.trim();save();return}
  if(t.id==='ow-en'){G.owner.end=t.value.trim();save();return}
  if(t.id==='ow-em'){G.owner.email=t.value.trim();save();return}
  if(t.id&&t.id.indexOf('pl-')===0&&G.planos[t.id.slice(3)]){G.planos[t.id.slice(3)].v=+t.value||0;save();return}
  if(t.id==='hp-pl'){const p=G.planos[t.value];if(p)$('#hp-v').value=p.v;hpLimUi();return}
  if(t.id==='ip-f'){const f=t.files[0];if(!f)return;readImage(f).then(d=>{IPF={name:f.name,data:d};$('#ip-prev').innerHTML='<img class="rcp" style="max-height:240px" src="'+d+'" alt="Pré-visualização do comprovante">';$('#ip-err').textContent=''}).catch(m=>{IPF=null;$('#ip-prev').innerHTML='';$('#ip-err').textContent=m});return}
  if(t.dataset&&t.dataset.chg){UI[t.dataset.chg]=t.value;render();return}
  if(UI.view==='croquis'&&UI.cq){const c=CQ(UI.cq);if(!c)return;
    if(t.id==='cq-n'){c.name=t.value;save()}
    else if(t.id==='cq-d'){c.desc=t.value;save()}
    else if(t.id==='cq-w'){c.W=Math.max(10,+t.value||c.W);save();redraw()}
    else if(t.id==='cq-h'){c.H=Math.max(10,+t.value||c.H);save();redraw()}
    else if(t.id==='cq-sd'){UI.showDist=t.checked;redraw()}}
});
$('#logoS').src=LOGO;
authLoad();
if(AUTH.ref){const L=$('#login');L.hidden=false;L.innerHTML='<div class="lg"><div class="lgc" style="text-align:center"><div class="lgl"><img src="'+LOGO+'" alt="EquiAltaris"></div><p class="muted" style="margin-top:14px">Carregando…</p></div></div>'}
else render();
boot();
let ULTACAO=Date.now();
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ULTACAO=Date.now()},true));
function ritmoSync(){
  if(!UI.user)return 60000;
  const v=UI.view;
  if(v==='chat'||v==='s_chat'||v==='feed')return 6000;      /* conversa: quase na hora */
  if(Date.now()-ULTACAO<120000)return 15000;                /* usando agora */
  return 60000;                                             /* aba esquecida aberta */
}
function lacoSync(){
  setTimeout(function(){
    if(!UI.user){lacoSync();return}
    Promise.resolve(syncPull()).catch(function(){}).then(lacoSync);
  },ritmoSync());
}
lacoSync();
setInterval(()=>{if(!UI.user)return;pulsar();
  if(UI.view==='o_hip'||UI.view==='o_uso'||UI.view==='alunos')loadPresenca().then(()=>{if(!document.querySelector('#modal .md'))render()})},45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UI.user)syncPull()});
})();
</script>
